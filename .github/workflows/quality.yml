name: Quality

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Check (all features)
        run: cargo check --all-features

      # Advisory: known warnings in-tree, so no `-D warnings` yet.
      - name: Clippy (all features)
        run: cargo clippy --all-features

      - name: Tests
        run: cargo test --workspace

      # `studio` is a default feature (2026-10-09): `cargo test --workspace`
      # above runs the Studio server tests. This step keeps the build without
      # it compiling — the `tengu studio --sandbox` stub that names the flag
      # and its test (`cli::studio::tests`).
      - name: Studio tests (without the studio feature)
        run: cargo test --no-default-features --features openrouter,telegram --bin tengu studio

      # The webhook listener (`--features webhooks`, not a default feature):
      # auth, queue bounds, each request's `trigger.webhook` /
      # `webhook.responded` trace events. `cargo test --workspace` above
      # compiles none of these tests.
      - name: Webhook tests (feature webhooks)
        run: cargo test --features webhooks --bin tengu webhooks
