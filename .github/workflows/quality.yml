name: Quality

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Check (all features)
        run: cargo check --all-features

      # Advisory: known warnings in-tree, so no `-D warnings` yet.
      - name: Clippy (all features)
        run: cargo clippy --all-features

      - name: Tests
        run: cargo test --workspace

      # `studio` is a default feature (2026-10-09): `cargo test --workspace`
      # above runs the Studio server tests. This step keeps the build without
      # it compiling — the `tengu studio --sandbox` stub that names the flag
      # and its test (`cli::studio::tests`).
      # `webhooks` is a default feature too (2026-10-22), so the webhook
      # listener tests run above as well; this build has neither.
      - name: Studio tests (without the studio feature)
        run: cargo test --no-default-features --features telegram --bin tengu studio

      # Sealed keys (docs/sealed-keys-2026-10-09.md): the shared formats crate
      # `crates/tengu-seal` is a workspace member (its tests run in `Tests`
      # above); the Worker ships for wasm32 outside the workspace, its
      # reply-body glue tests run on the host.
      - name: Seal Worker (wasm32 fmt + clippy, host tests)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo fmt --manifest-path cloudflare/seal-worker/Cargo.toml --check
          cargo clippy --manifest-path cloudflare/seal-worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
          cargo test --manifest-path cloudflare/seal-worker/Cargo.toml
