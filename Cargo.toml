[workspace]
members = [
    "crates/tengu-core",
    "crates/tengu-backends",
    "crates/tengu-channels",
    "crates/tengu-optimizer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
qdrant-client = "1.14"
tengu-core = { path = "crates/tengu-core" }
tengu-backends = { path = "crates/tengu-backends" }
tengu-channels = { path = "crates/tengu-channels" }
tengu-optimizer = { path = "crates/tengu-optimizer" }

[package]
name = "tengu-cluster"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tengu"
path = "src/main.rs"

[dependencies]
tengu-core.workspace = true
tengu-backends.workspace = true
tengu-channels.workspace = true
tengu-optimizer.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
uuid.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs-next = "2.0"
bincode = "1"
dotenvy = "0.15"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rpassword = "7"
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
pdf-extract = "0.10"
regex = "1"
qdrant-client = { workspace = true, optional = true }
alloy = { version = "1", features = ["full"] }

[features]
default = ["ollama", "anthropic", "openai", "openrouter", "claude-code", "telegram"]
telegram = ["tengu-channels/telegram"]
ollama = ["tengu-backends/ollama"]
anthropic = ["tengu-backends/anthropic"]
openai = ["tengu-backends/openai"]
claude-code = ["tengu-backends/claude-code"]
openrouter = ["tengu-backends/openrouter"]
huggingface = ["tengu-backends/huggingface"]
qdrant = ["qdrant-client"]

[dev-dependencies]
tempfile = "3"
