[package]
name = "tengu-cluster"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"

[[bin]]
name = "tengu"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "socks"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2.0"
bincode = "1"
dotenvy = "0.15"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rpassword = "7"
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
pdf-extract = "0.10"
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
once_cell = "1"
alloy = { version = "1", features = ["full"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tokio-stream = "0.1"
tempfile = "3"
glob = "0.3"
similar = "2"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"], optional = true }
teloxide = { version = "0.13", features = ["macros"], optional = true }
# teloxide takes a reqwest 0.11 Client; this alias (unified with its copy, no
# new crate) lets telegram_builder build one with Tor-sized timeouts.
reqwest011 = { package = "reqwest", version = "0.11", default-features = false, optional = true }
dptree = { version = "0.3", optional = true }
# Inbound webhook listener (gated by `webhooks` feature). axum is the
# only http SERVER dep — `reqwest` already covers outbound. `hmac` is
# the constant-time MAC primitive used to verify `X-Tengu-Signature`
# headers; pairs with the existing `sha2` for SHA-256.
axum = { version = "0.7", optional = true }
hmac = { version = "0.12", optional = true }
[features]
default = ["openrouter", "telegram"]
telegram = ["teloxide", "dptree", "reqwest011"]
openrouter = []
postgres_memory = ["tokio-postgres"]
claude_code = []
webhooks = ["axum", "hmac"]
