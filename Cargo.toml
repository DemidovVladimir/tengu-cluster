[package]
name = "tengu-cluster"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tengu"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.33"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex-lite = "0.1"
dirs-next = "2.0"
bincode = "1"
dotenvy = "0.15"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rpassword = "7"
cursive = { version = "0.21", default-features = false, features = ["crossterm-backend"] }
pdf-extract = "0.10"
regex = "1"
alloy = { version = "1", features = ["full"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tokio-stream = "0.1"
tempfile = "3"
qdrant-client = { version = "1.14", optional = true }
teloxide = { version = "0.13", features = ["macros"], optional = true }
dptree = { version = "0.3", optional = true }
[features]
default = ["openrouter", "telegram"]
telegram = ["teloxide", "dptree"]
openrouter = []
qdrant = ["qdrant-client"]
claude_code = []

[dev-dependencies]
