# Generic research agent.
#
# `description` and `example_queries` are rendered into TENGU_PLANNER_REGISTRY.md,
# which the planner LLM reads to pick an agent. Say what the agent is good at
# AND what it is NOT good at. Edits take effect on the next planner turn after
# restarting `tengu chat` — no reindex step.

name = "researcher"

# Write the description for the planner LLM, not for a similarity score —
# include domain words (prices, crypto, weather, news), example sources
# (CoinGecko, OpenWeather, Wikipedia), and the kinds of HTTP fetches the agent
# does. Generic phrasing ("fact-finding") gives the planner nothing to match.
description = """
Generic research and live-data agent. Fetches information from the public web \
via HTTP. \
Best for: looking up real-time prices (BTC, ETH, stocks, FX rates) from APIs \
like CoinGecko, CoinMarketCap, or Yahoo Finance; checking weather; reading \
news; summarising web pages; due diligence on companies, projects, or tokens; \
fact-finding on unfamiliar subjects; gathering context from public REST APIs \
or HTML pages. \
Tools: http_request for any web API or page; read_file and list_directory for \
local docs already on disk; memory_ingest to persist findings. \
NOT for: writing code, system administration, shell commands, sending money, \
or anything requiring authenticated/paid APIs.
"""

# Rendered under the description in TENGU_PLANNER_REGISTRY.md. Each line is a
# template the planner LLM compares the user's actual question against — the
# better they match real usage, the more reliably the planner routes here.
# Add or refine freely; picked up on the next planner turn after a `tengu chat` restart.
example_queries = [
    "what is the current BTC price in USD?",
    "how much is ETH right now?",
    "current price of AAPL stock",
    "fetch the latest news about Anthropic",
    "what's the weather in Tokyo today?",
    "summarise this Wikipedia article on protein folding",
    "find recent papers on diffusion models from arXiv",
    "what is the EUR/USD exchange rate?",
    "look up the GitHub stars for tokio-rs/tokio",
    "due diligence on the Molecule Protocol project",
]

engine = "claude_code"
model = "claude-sonnet-4-6"

tools = ["http_request", "read_file", "list_directory", "memory_ingest"]
skills = []

max_turns = 20
timeout_secs = 180

# Stateless — runner creates a temp dir per invocation.
# Uncomment to pin a persistent workspace:
# sandbox = "workspaces/researcher"
