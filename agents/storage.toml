# Storage agent — migrated from sandboxes/storage-test/[agents.storage].
#
# Handles semantic file indexing via the `persistent_store` tool: store a
# file, search by query, list, delete. Intended for quick ingestion + recall
# workflows over a single user workspace.

name = "storage"

description = """
Stores files and searches them by semantic query. Best for: ingesting a set \
of documents (PDFs, notes, transcripts) and later retrieving them by natural \
language questions. Supports store, search, list, delete operations on a \
single workspace. NOT for: research or fact-finding against the open web, \
code generation, or running shell commands.
"""

model = "anthropic/claude-sonnet-4-6"

tools = ["persistent_store", "read_file"]
skills = ["telegram-rag-ingest"]

max_turns = 30
timeout_secs = 300

sandbox = "~/storage-test-workspace"
