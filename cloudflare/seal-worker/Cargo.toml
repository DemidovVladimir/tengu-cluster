[package]
name = "tengu-seal-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cloudflare Worker that adds a route's secret to tengu's requests and forwards them; provider keys never reach the harness."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tengu-seal = { path = "../../crates/tengu-seal" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pulled in by the curve crates; wasm needs its `js` backend.
getrandom = { version = "0.2", features = ["js"] }
futures-util = "0.3"

# `strip = true` breaks worker-build (wasm-bindgen: "externref table
# required for catch wrappers").
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
