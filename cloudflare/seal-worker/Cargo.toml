[package]
name = "tengu-seal-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cloudflare Worker that opens tengu's sealed blobs, injects the secret and forwards the request."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tengu-seal = { path = "../../crates/tengu-seal" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Browser/Workers RNG for the vault seed and session nonces.
getrandom = { version = "0.2", features = ["js"] }
base64 = "0.22"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
