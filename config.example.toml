# Tengu Cluster — Example Configuration
# Copy to ~/.tengu/config.toml and customize

# --- Secrets ---
# Store API keys in ~/.tengu/secrets.vault (AES-256-GCM encrypted, chmod 600).
# Run: tengu secret init          (creates vault, prompts for master password)
# Then: tengu secret set OPENROUTER_API_KEY sk-or-...
# Or set TENGU_MASTER_PASSWORD env var to skip interactive prompts.

# Runtime profile: "auto" | "cloud" | "desktop" | "minimal"
runtime_profile = "auto"

[hub]
bind = "127.0.0.1"
port = 7070
auth_mode = "token"

[hub.reload]
mode = "hybrid"

# Refiner: "off" | "rules" | "local" | "remote"
[refiner]
mode = "off"

# --- Default Agent ---
# OpenRouter is recommended: one API key for all providers, one bill.
# Set OPENROUTER_API_KEY in your environment.
# Browse models at https://openrouter.ai/models

[agents.main]
default = true
engine = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
# workspace = "~/projects/my-app"
default_lens = "eco"

# OpenRouter model examples (just change the model line):
# model = "nvidia/nemotron-3-super-120b-a12b:free"  # Nemotron 120B (free)
# model = "nvidia/nemotron-3-super-120b-a12b:free"        # Claude Sonnet 4 (premium)
# model = "openai/gpt-4o"                    # GPT-4o
# model = "google/gemini-2.5-pro"            # Gemini 2.5 Pro
# model = "meta-llama/llama-4-maverick"      # Llama 4 Maverick
# model = "deepseek/deepseek-chat-v3"        # DeepSeek V3 (cheapest)

# Alternative: direct provider engines (requires provider-specific API key)
# engine = "anthropic"
# model = "claude-sonnet-4-20250514"
# engine = "openai"
# model = "gpt-4o-mini"
# engine = "ollama"
# model = "llama3.2"
# engine = "huggingface"
# model = "THUDM/GLM-4.7:fastest"
# engine = "claude-code"
# model = "claude-sonnet-4-5-20250929"

[agents.main.identity]
name = "Tengu"
# instructions = "You are a Rust programming assistant. Be concise."

[agents.main.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30
# max_history_turns = 20
# compaction_threshold_ratio = 0.82
# compaction_keep_turns = 24
# compaction_summary_max_tokens = 320

[agents.main.limits]
max_tokens_per_flow = 100_000       # Hard limit. Warning sent at 80%. Use /reset to start fresh.
# context_window_override = 200000
# max_output_tokens_per_turn = 4096
# max_cost_per_flow = 5.0           # USD cost limit (optional)
# warn_at_cost = 4.0                # USD cost warning threshold (must be <= max_cost_per_flow)

# --- Persistent Vector Memory ---
# Shared across agents. Stores facts/insights for cross-session retrieval.
# Requires OPENROUTER_API_KEY for embedding generation.

# [memory]
# enabled = true
# embedding_model = "text-embedding-3-small"
# max_recall_entries = 5
# max_recall_tokens = 600
# store_path = "~/.tengu/memory/"
#
# --- Qdrant vector store backend (optional) ---
# Requires: cargo build --features qdrant
# Start Qdrant: docker run -p 6333:6333 -p 6334:6334 qdrant/qdrant
#
# backend = "qdrant"                          # "disk" (default) or "qdrant"
# qdrant_url = "http://localhost:6334"        # gRPC endpoint
# qdrant_collection = "tengu-memory"          # collection name
# vector_size = 1536                          # must match embedding model output dim
# qdrant_api_key = "${QDRANT_API_KEY}"        # for Qdrant Cloud (optional)

# --- Telegram Bot ---
# Run with: tengu telegram
# Set TELEGRAM_BOT_TOKEN in secrets vault or env.
# Get a token from @BotFather on Telegram.
# Get your user ID from @userinfobot on Telegram.

# [telegram]
# enabled = true
# allowed_users = ["123456789"]

# --- Fleet Orchestration ---
# Run a multi-agent fleet, all through OpenRouter — one bill, multiple models.
# Run with: tengu orchestrate
# Use sandboxes for domain-specific teams: tengu orchestrate --sandbox webstudio
# See tengu/Sandboxes.md for details.

# [orchestrator]
# enabled = true
# max_retries = 0
# planner_engine = "openrouter"         # Dedicated engine for task planning/classification
# planner_model = "google/gemini-2.5-flash"  # Cheaper/faster model for planning (default: uses default agent's model)

# Roles are dynamic — any non-empty string works.
# Define role behavior in identity.instructions.
# Use capabilities for hard permissions and skill_packages for workflow docs/tools.
#
# Available capabilities:
#   workspace.read, workspace.list, workspace.write, workspace.shell — file + shell
#   http.request           — generic HTTP client (any REST API via skills)
#   crypto.sign_tx         — EVM transaction signing via Privy wallet
#   crypto.sign_message    — message signing via Privy wallet
#   crypto.wallet_address  — read wallet address
#   crypto.abi_encode      — ABI-encode EVM function calls into calldata
#   memory.write           — persist memory entries
#   DeSci workflows should be modeled as skills over the generic HTTP/crypto tools

