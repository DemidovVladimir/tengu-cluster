# Tengu Cluster — Example Configuration
# Copy to ~/.tengu/config.toml and customize

# Runtime profile: "auto" | "cloud" | "desktop" | "minimal"
runtime_profile = "auto"

[hub]
bind = "127.0.0.1"
port = 7070
auth_mode = "token"
# auth_token = "${TENGU_TOKEN}"

[hub.reload]
mode = "hybrid"

# Refiner: "off" | "rules" | "local" | "remote"
[refiner]
mode = "off"
# model = "SmolLM2-360M"          # for mode = "local"
# url = "http://192.168.1.100:7070" # for mode = "remote"

[agents.main]
default = true
engine = "ollama"
model = "llama3.2"
# Example hosted provider setup:
# engine = "anthropic"
# model = "claude-3-5-sonnet-latest"
# engine = "openai"
# model = "gpt-4o-mini"
# engine = "huggingface"
# model = "THUDM/GLM-4.7:fastest" # Inference Providers selector syntax
# engine = "claude-code"
# model = "claude-sonnet-4-5-20250929"
# workspace = "~/projects/my-app"
default_lens = "eco"

[agents.main.identity]
name = "Tengu"

[agents.main.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30
# max_history_turns = 80
# Defaults are derived from model context/input budget if omitted.
# compaction_threshold_ratio = 0.82
# compaction_keep_turns = 24
# compaction_summary_max_tokens = 320

[agents.main.limits]
max_tokens_per_flow = 500_000
# max_cost_per_flow = 5.00
# warn_at_cost = 2.00
# Optional per-model override when provider default context mapping is not accurate.
# context_window_override = 128000
# Optional per-turn provider output cap (replaces backend fallback defaults).
# max_output_tokens_per_turn = 4096

[agents.main.kit]
allow = ["read_file", "write_file", "edit_file", "find_files", "search_content", "shell"]
deny = []
# Optional explicit approval gates:
# approval_required = ["write_file", "edit_file", "shell"]
# approved = ["write_file"]

[agents.main.skill_policy]
# Optional skill allow/deny policy for runtime capability checks.
allow = []
deny = []

[agents.main.store]
files = ["CONTEXT.md", "IDENTITY.md", "PROFILE.md", "NOTES.md", "notes/*.md"]

# Routing: which pipe sends to which agent
[[routing]]
agent = "main"
pipe = "cli"

# Runtime topology policy:
# - "flat": no topology-specific handoff restrictions
# - "single-orchestrator": enforce one orchestrator dispatching to bounded dependents
[topology]
mode = "flat"
# orchestrator_agent = "main"
# dependent_agents = ["engineering", "marketing", "product"]
# allow_direct_dependent_communication = false
max_handoff_depth = 2

# Notes:
# - in `single-orchestrator` mode, `topology.orchestrator_agent` is required
# - if `capability_governance.mode = "delegated"`, delegated orchestrator must match topology orchestrator
# - if `dependent_agents` is empty, any configured non-orchestrator agent is allowed as handoff receiver

# Pipes
[pipes.cli]
enabled = true

# [pipes.telegram]
# enabled = true
# token = "${TELEGRAM_BOT_TOKEN}"
# access_policy = "approval"

# [pipes.discord]
# enabled = false
# token = "${DISCORD_BOT_TOKEN}"

# [pipes.webchat]
# enabled = false
# bind = "127.0.0.1:7071"

[skills]
watch = true
extra_dirs = []

[capability_governance]
# "user" keeps capability usage strictly within user-defined static policy.
# "delegated" lets one orchestrator request bounded capabilities via handoff envelopes.
# In delegated mode, chat runtime exposes `/assign`, `/assignments`, `/unassign`,
# and `/assignments clear` commands for bounded dependent capability assignment lifecycle.
# Assignment lifecycle events are persisted to `~/.tengu/state/audit/capability_assignments.jsonl`.
# Approved assignments are replayed from this audit log at startup.
# Runtime also auto-expires stale delegated assignments by TTL policy
# (`TENGU_DELEGATED_ASSIGNMENT_TTL_SECS` env override).
mode = "user"
# delegated_orchestrator_agent = "orchestrator"
