#cloud-config
# Tengu Cluster — Cloud-Init for VPS provisioning
#
# Works with: Hetzner Cloud, DigitalOcean, AWS EC2, GCP, Vultr, etc.
#
# Usage (Hetzner CLI):
#   hcloud server create \
#     --name tengu \
#     --type cx22 \
#     --image ubuntu-24.04 \
#     --user-data-from-file deploy/cloud-init.yml \
#     --ssh-key my-key
#
# After provisioning:
#   ssh root@<ip>
#   cd /opt/tengu-cluster
#   nano .env                # set API keys
#   nano config.toml         # customize agents; [egress] network = "open" to skip Tor
#   make up                  # tengu behind the Tor proxy (make up NETWORK=open for direct)

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - make
  - jq
  - htop
  - unattended-upgrades

# Install Docker + clone repo + configure
runcmd:
  # Docker
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker

  # Clone tengu-cluster + lyrebird-rs (Tor pluggable transports for deploy/tor)
  - git clone --depth 1 https://github.com/DemidovVladimir/tengu-cluster.git /opt/tengu-cluster
  - git clone --depth 1 https://github.com/DemidovVladimir/lyrebird-rs.git /opt/lyrebird-rs

  # Configure
  - cd /opt/tengu-cluster && cp .env.example .env && cp config.example.toml config.toml

  # Bind the webhook listener ([webhooks] bind, port 7080 — `tengu webhooks`,
  # feature `webhooks`) to 0.0.0.0 for external access. Only the [webhooks]
  # section is rewritten; nothing listens on [hub].port. Only matters for
  # `make up NETWORK=open` (the default Tor topology publishes no ports),
  # with the [webhooks] block uncommented and the image built with
  # TENGU_FEATURES=openrouter,telegram,webhooks.
  - sed -i '/^\[webhooks\]/,/^\[/ s/^bind = "127.0.0.1"/bind = "0.0.0.0"/' /opt/tengu-cluster/config.toml

  # Build images (tengu + Tor proxy) so they're ready when the user SSH's in
  - cd /opt/tengu-cluster && make build

  # Create systemd service for auto-start on reboot
  - |
    cat > /etc/systemd/system/tengu.service << 'UNIT'
    [Unit]
    Description=Tengu Cluster
    After=docker.service
    Requires=docker.service

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    WorkingDirectory=/opt/tengu-cluster
    ExecStart=/usr/bin/make up
    ExecStop=/usr/bin/make down
    # `make up` blocks until the tor service is healthy (bootstrap through a
    # bridge: ~30 s for obfs4, minutes for snowflake on a cold volume).
    TimeoutStartSec=900

    [Install]
    WantedBy=multi-user.target
    UNIT
  - systemctl daemon-reload
  - systemctl enable tengu.service

  # Firewall: allow SSH + the webhook listener port (7080 — reachable only
  # under `make up NETWORK=open`; harmless otherwise)
  - ufw allow 22/tcp
  - ufw allow 7080/tcp
  - ufw --force enable

write_files:
  - path: /etc/motd
    content: |
      ╔══════════════════════════════════════════════════╗
      ║  Tengu Cluster                                   ║
      ║                                                  ║
      ║  Config:  /opt/tengu-cluster/.env                ║
      ║           /opt/tengu-cluster/config.toml         ║
      ║                                                  ║
      ║  Start:   cd /opt/tengu-cluster && make up       ║
      ║  Logs:    make logs                              ║
      ║  Status:  make status                            ║
      ╚══════════════════════════════════════════════════╝

final_message: "Tengu Cluster provisioned in $UPTIME seconds. SSH in and run: cd /opt/tengu-cluster && nano .env && make up"
