# Tengu Cluster — Docker Compose
#
# Usage:
#   docker compose up -d                              # Default (OpenRouter + Telegram)
#   docker compose --profile qdrant up -d             # + Qdrant vector memory
#
# Config:
#   1. cp .env.example .env && edit .env (set API keys)
#   2. cp config.example.toml config.toml && edit config.toml
#   Or use: make setup

services:
  # ── Tengu Agent ───────────────────────────────────────────────
  tengu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: "${TENGU_FEATURES:-openrouter,telegram}"
    image: tengu-cluster:latest
    container_name: tengu
    restart: unless-stopped
    env_file: .env
    environment:
      - TENGU_CONFIG=/opt/tengu/config.toml
      - TENGU_HOME=/opt/tengu/data
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ./config.toml:/opt/tengu/config.toml:ro
      - tengu-data:/opt/tengu/data
    ports:
      - "${TENGU_PORT:-7070}:7070"
    healthcheck:
      test: ["CMD", "tengu", "doctor"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_started
        required: false

  # ── Qdrant Vector DB ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tengu-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    profiles:
      - qdrant

volumes:
  tengu-data:
  qdrant-data:
