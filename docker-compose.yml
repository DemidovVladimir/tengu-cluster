# Tengu Cluster — Docker Compose
#
# Usage:
#   docker compose up -d                              # Default (OpenRouter + Telegram)
#   docker compose --profile postgres-memory up -d postgres-memory   # DB only (native binary)
#
# Agentic memory needs the image built WITH the feature, not just the profile:
#   TENGU_FEATURES=openrouter,telegram,postgres_memory docker compose --profile postgres-memory up -d --build
#
# Ports: 7080 is the webhook listener (`tengu webhooks`, feature `webhooks`).
# Nothing listens on [hub].port.
#
# Config:
#   1. cp .env.example .env && edit .env (set API keys)
#   2. cp config.example.toml config.toml && edit config.toml
#   Or use: make setup

services:
  # ── Tengu Agent ───────────────────────────────────────────────
  tengu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FEATURES: "${TENGU_FEATURES:-openrouter,telegram}"
    image: tengu-cluster:latest
    container_name: tengu
    restart: unless-stopped
    env_file: .env
    environment:
      - TENGU_CONFIG=/opt/tengu/config.toml   # honoured by the binary; agents/ + sandboxes/ are baked into the image
      - TENGU_HOME=/opt/tengu/data
      - TENGU_MEMORY_DATABASE_URL=${TENGU_MEMORY_DATABASE_URL:-postgres://tengu:tengu@postgres-memory:5432/tengu_memory}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - ./config.toml:/opt/tengu/config.toml:ro
      - tengu-data:/opt/tengu/data
    ports:
      - "${TENGU_WEBHOOK_PORT:-7080}:7080"
    healthcheck:
      test: ["CMD", "tengu", "doctor"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      postgres-memory:
        condition: service_healthy
        required: false

  # ── Agentic Memory Postgres + pgvector ──────────────────────
  postgres-memory:
    image: pgvector/pgvector:pg16
    container_name: tengu-postgres-memory
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TENGU_MEMORY_POSTGRES_DB:-tengu_memory}
      POSTGRES_USER: ${TENGU_MEMORY_POSTGRES_USER:-tengu}
      POSTGRES_PASSWORD: ${TENGU_MEMORY_POSTGRES_PASSWORD:-tengu}
    ports:
      - "${TENGU_MEMORY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-memory-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - postgres-memory

volumes:
  tengu-data:
  postgres-memory-data:
