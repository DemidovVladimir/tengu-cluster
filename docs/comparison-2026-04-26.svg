<svg viewBox="0 0 980 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="title">Tengu-Cluster vs Hermes Agent vs PI/Cowork — architecture comparison, April 2026</title>
  <desc id="desc">Three-column comparison across architecture stack, memory model, skills (incl. self-adjustment), tools, and four deltas landed today (per-example vectors, TUI debug panel, durable user-message persistence, plus the registry recall + auto-reindex from earlier this session).</desc>
  <style>
    .h1 { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .h2 { font-size: 12px; font-weight: 700; fill: #0f172a; letter-spacing: .4px; text-transform: uppercase; }
    .h3 { font-size: 11px; font-weight: 600; fill: #334155; }
    .body { font-size: 11px; fill: #334155; }
    .small { font-size: 10px; fill: #64748b; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; fill: #334155; }
    .col-tengu { fill: #f5f3ff; stroke: #c4b5fd; }
    .col-hermes { fill: #f0f9ff; stroke: #7dd3fc; }
    .col-pi { fill: #ecfdf5; stroke: #6ee7b7; }
    .pill-tengu { fill: #7c3aed; }
    .pill-hermes { fill: #0284c7; }
    .pill-pi { fill: #059669; }
    .row { fill: #ffffff; stroke: #e2e8f0; }
    .row-alt { fill: #f8fafc; stroke: #e2e8f0; }
    .ok { fill: #16a34a; }
    .warn { fill: #ca8a04; }
    .miss { fill: #dc2626; }
    .new { fill: #0891b2; }
  </style>

  <text x="20" y="26" class="h1">Tengu-Cluster vs Hermes Agent vs PI/Cowork — architecture snapshot</text>
  <text x="20" y="44" class="small">April 26, 2026 · post per-example vectors + TUI debug panel + durable msg persistence (today) · companion to docs/tengu-analysis.html</text>

  <g transform="translate(20, 58)">
    <rect width="940" height="22" rx="4" class="row" />
    <circle cx="14" cy="11" r="4" class="ok" />
    <text x="24" y="14" class="small">shipped, working</text>
    <circle cx="135" cy="11" r="4" class="warn" />
    <text x="145" y="14" class="small">partial / lite version</text>
    <circle cx="265" cy="11" r="4" class="miss" />
    <text x="275" y="14" class="small">not yet built</text>
    <circle cx="365" cy="11" r="4" class="new" />
    <text x="375" y="14" class="small">landed today (2026-04-26)</text>
    <text x="540" y="14" class="small">Each column is one project, top to bottom is the request → response path.</text>
  </g>

  <g transform="translate(20, 92)">
    <rect x="0" y="0" width="305" height="28" rx="4" class="pill-tengu" />
    <text x="12" y="18" font-size="13" font-weight="700" fill="#fff">Tengu-Cluster · Rust · vibe-coded v2</text>
    <rect x="317" y="0" width="305" height="28" rx="4" class="pill-hermes" />
    <text x="329" y="18" font-size="13" font-weight="700" fill="#fff">Hermes Agent · Python · Nous Research</text>
    <rect x="635" y="0" width="305" height="28" rx="4" class="pill-pi" />
    <text x="647" y="18" font-size="13" font-weight="700" fill="#fff">PI / Cowork · TS+Claude SDK · Anthropic</text>
  </g>

  <g transform="translate(20, 132)">
    <rect x="0" y="0" width="305" height="44" rx="4" class="col-tengu" />
    <text x="10" y="16" class="h3">Surfaces</text>
    <text x="10" y="30" class="body">TUI (cursive) · Telegram</text>
    <text x="10" y="42" class="small">cargo run -- chat / telegram</text>
    <rect x="317" y="0" width="305" height="44" rx="4" class="col-hermes" />
    <text x="327" y="16" class="h3">Surfaces</text>
    <text x="327" y="30" class="body">CLI · TG · Discord · Slack · WA · Signal</text>
    <text x="327" y="42" class="small">single gateway process · voice memo support</text>
    <rect x="635" y="0" width="305" height="44" rx="4" class="col-pi" />
    <text x="645" y="16" class="h3">Surfaces</text>
    <text x="645" y="30" class="body">Desktop app · Browser ext · MCP host</text>
    <text x="645" y="42" class="small">Cowork mode · computer-use · artifacts</text>

    <rect x="0" y="50" width="305" height="56" rx="4" class="col-tengu" />
    <text x="10" y="66" class="h3">Orchestration / planner</text>
    <text x="10" y="80" class="body">RagPlanner → SubprocessRunner → run-agent</text>
    <text x="10" y="92" class="mono">engine = "rag" | "static"</text>
    <circle cx="296" cy="98" r="3" class="new" />
    <text x="10" y="103" class="small">+ event bus, RagQueried, auto-reindex</text>
    <rect x="317" y="50" width="305" height="56" rx="4" class="col-hermes" />
    <text x="327" y="66" class="h3">Orchestration / planner</text>
    <text x="327" y="80" class="body">run_agent() loop · memory prefetch + sync</text>
    <text x="327" y="92" class="mono">subagent.spawn() · ACP adapter</text>
    <text x="327" y="103" class="small">closed learning loop with periodic nudges</text>
    <rect x="635" y="50" width="305" height="56" rx="4" class="col-pi" />
    <text x="645" y="66" class="h3">Orchestration / planner</text>
    <text x="645" y="80" class="body">Claude Agent SDK · TaskList tool</text>
    <text x="645" y="92" class="mono">Agent tool spawns subagents</text>
    <text x="645" y="103" class="small">user-driven; AskUserQuestion gates ambiguity</text>

    <rect x="0" y="112" width="305" height="56" rx="4" class="col-tengu" />
    <text x="10" y="128" class="h3">Model + tools</text>
    <text x="10" y="142" class="body">OpenRouter (any model) + Claude Code engine</text>
    <text x="10" y="154" class="mono">PluginToolExecutor · http · crypto · MCP</text>
    <text x="10" y="165" class="small">workspace_tools allow-list of THREE</text>
    <rect x="317" y="112" width="305" height="56" rx="4" class="col-hermes" />
    <text x="327" y="128" class="h3">Model + tools</text>
    <text x="327" y="142" class="body">200+ providers · 6 terminal backends</text>
    <text x="327" y="154" class="mono">40+ tools · agentskills.io standard</text>
    <text x="327" y="165" class="small">Daytona/Modal serverless persistence</text>
    <rect x="635" y="112" width="305" height="56" rx="4" class="col-pi" />
    <text x="645" y="128" class="h3">Model + tools</text>
    <text x="645" y="142" class="body">Sonnet/Opus/Haiku · ToolSearch deferred</text>
    <text x="645" y="154" class="mono">MCP marketplace · Read/Write/Edit/Bash</text>
    <text x="645" y="165" class="small">Chrome ext + computer-use tiers</text>

    <rect x="0" y="174" width="305" height="44" rx="4" class="col-tengu" />
    <text x="10" y="190" class="h3">State / persistence</text>
    <text x="10" y="204" class="body">legacy vector DB: TENGU_PLANNER_REGISTRY.md/messages/outputs</text>
    <text x="10" y="216" class="small">embeds via OpenAI text-embedding-3-small</text>
    <rect x="317" y="174" width="305" height="44" rx="4" class="col-hermes" />
    <text x="327" y="190" class="h3">State / persistence</text>
    <text x="327" y="204" class="body">SQLite (FTS5) + Honcho dialectic model</text>
    <text x="327" y="216" class="small">session search + LLM-summarised recall</text>
    <rect x="635" y="174" width="305" height="44" rx="4" class="col-pi" />
    <text x="645" y="190" class="h3">State / persistence</text>
    <text x="645" y="204" class="body">CLAUDE.md + plain-text memory files</text>
    <text x="645" y="216" class="small">consolidate-memory skill periodically</text>
  </g>

  <line x1="20" y1="370" x2="960" y2="370" stroke="#e2e8f0" />
  <text x="20" y="388" class="h2">Four axes the user asked about</text>

  <g transform="translate(20, 400)">
    <rect x="0" y="0" width="160" height="26" rx="4" class="row-alt" />
    <text x="10" y="17" class="h3">Axis</text>
    <rect x="162" y="0" width="265" height="26" rx="4" class="row-alt" />
    <text x="172" y="17" class="h3" fill="#7c3aed">Tengu</text>
    <rect x="429" y="0" width="265" height="26" rx="4" class="row-alt" />
