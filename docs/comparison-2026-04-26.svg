    <text x="706" y="17" class="h3" fill="#059669">PI / Cowork</text>
  </g>

  <g transform="translate(20, 428)">
    <rect x="0" y="0" width="160" height="68" rx="4" class="row" />
    <text x="10" y="18" class="h3">Memory</text>
    <text x="10" y="34" class="small">how state persists</text>
    <text x="10" y="50" class="small">across turns/sessions</text>
    <rect x="162" y="0" width="265" height="68" rx="4" class="row" />
    <circle cx="172" cy="14" r="4" class="ok" /><text x="182" y="18" class="body">3 legacy vector DB collections</text>
    <circle cx="172" cy="32" r="4" class="warn" /><text x="182" y="36" class="body">in-mem ring buffer (lite)</text>
    <circle cx="172" cy="50" r="4" class="new" /><text x="182" y="54" class="body">durable msg writes (today)</text>
    <text x="172" y="65" class="small">no cross-restart read-back yet</text>
    <rect x="429" y="0" width="265" height="68" rx="4" class="row" />
    <circle cx="439" cy="14" r="4" class="ok" /><text x="449" y="18" class="body">FTS5 session search</text>
    <circle cx="439" cy="32" r="4" class="ok" /><text x="449" y="36" class="body">LLM summarisation pass</text>
    <circle cx="439" cy="50" r="4" class="ok" /><text x="449" y="54" class="body">Honcho user model</text>
    <text x="449" y="65" class="small">periodic memory nudges</text>
    <rect x="696" y="0" width="244" height="68" rx="4" class="row" />
    <circle cx="706" cy="14" r="4" class="warn" /><text x="716" y="18" class="body">CLAUDE.md + .md memory</text>
    <circle cx="706" cy="32" r="4" class="warn" /><text x="716" y="36" class="body">consolidate-memory skill</text>
    <circle cx="706" cy="50" r="4" class="miss" /><text x="716" y="54" class="body">no vector store</text>
    <text x="716" y="65" class="small">manual file tending</text>
  </g>

  <g transform="translate(20, 500)">
    <rect x="0" y="0" width="160" height="68" rx="4" class="row" />
    <text x="10" y="18" class="h3">Skills + self-adjust</text>
    <text x="10" y="34" class="small">how the agent grows</text>
    <text x="10" y="50" class="small">its own capabilities</text>
    <rect x="162" y="0" width="265" height="68" rx="4" class="row" />
    <circle cx="172" cy="14" r="4" class="ok" /><text x="182" y="18" class="body">3-tier scanner (managed/ws/dot)</text>
    <circle cx="172" cy="32" r="4" class="ok" /><text x="182" y="36" class="body">orchestrator SKILL.md as prompt</text>
    <circle cx="172" cy="50" r="4" class="miss" /><text x="182" y="54" class="body">no autonomous evolution</text>
    <text x="172" y="65" class="small">skill_distill exists, not in loop</text>
    <rect x="429" y="0" width="265" height="68" rx="4" class="row" />
    <circle cx="439" cy="14" r="4" class="ok" /><text x="449" y="18" class="body">autonomous skill creation</text>
    <circle cx="439" cy="32" r="4" class="ok" /><text x="449" y="36" class="body">in-use self-improvement</text>
    <circle cx="439" cy="50" r="4" class="ok" /><text x="449" y="54" class="body">agentskills.io standard</text>
    <text x="449" y="65" class="small">closed learning loop · live</text>
    <rect x="696" y="0" width="244" height="68" rx="4" class="row" />
    <circle cx="706" cy="14" r="4" class="ok" /><text x="716" y="18" class="body">skill-creator skill (manual)</text>
    <circle cx="706" cy="32" r="4" class="warn" /><text x="716" y="36" class="body">user-guided LLM-assisted</text>
    <circle cx="706" cy="50" r="4" class="miss" /><text x="716" y="54" class="body">no autonomous evolution</text>
    <text x="716" y="65" class="small">plugin marketplace fills gap</text>
  </g>

  <g transform="translate(20, 572)">
    <rect x="0" y="0" width="160" height="60" rx="4" class="row" />
    <text x="10" y="18" class="h3">Tools</text>
    <text x="10" y="34" class="small">what the agent</text>
    <text x="10" y="50" class="small">can DO</text>
    <rect x="162" y="0" width="265" height="60" rx="4" class="row" />
    <circle cx="172" cy="14" r="4" class="ok" /><text x="182" y="18" class="body">PluginToolExecutor + MCP bridge</text>
    <circle cx="172" cy="32" r="4" class="ok" /><text x="182" y="36" class="body">Privy crypto + http + workspace</text>
    <circle cx="172" cy="50" r="4" class="warn" /><text x="182" y="54" class="body">placeholder_tools (6 hardcoded)</text>
    <rect x="429" y="0" width="265" height="60" rx="4" class="row" />
    <circle cx="439" cy="14" r="4" class="ok" /><text x="449" y="18" class="body">40+ tools · 6 terminal backends</text>
    <circle cx="439" cy="32" r="4" class="ok" /><text x="449" y="36" class="body">cron scheduler + voice + RPC</text>
    <circle cx="439" cy="50" r="4" class="ok" /><text x="449" y="54" class="body">parallel subagents</text>
    <rect x="696" y="0" width="244" height="60" rx="4" class="row" />
    <circle cx="706" cy="14" r="4" class="ok" /><text x="716" y="18" class="body">MCP marketplace + connectors</text>
    <circle cx="706" cy="32" r="4" class="ok" /><text x="716" y="36" class="body">Read/Write/Edit/Bash + Chrome</text>
    <circle cx="706" cy="50" r="4" class="ok" /><text x="716" y="54" class="body">computer-use tiered</text>
  </g>

  <g transform="translate(20, 636)">
    <rect x="0" y="0" width="160" height="60" rx="4" class="row" />
    <text x="10" y="18" class="h3">Routing model</text>
    <text x="10" y="34" class="small">how the agent</text>
    <text x="10" y="50" class="small">decides what to do</text>
    <rect x="162" y="0" width="265" height="60" rx="4" class="row" />
    <circle cx="172" cy="14" r="4" class="ok" /><text x="182" y="18" class="body">Open Brain / Karpathy LLM Wiki over registry · cosine ≥ ~0.15</text>
    <circle cx="172" cy="32" r="4" class="new" /><text x="182" y="36" class="body">per-example vectors (today)</text>
    <text x="172" y="52" class="small">LLM judges roster (no hard gate)</text>
    <rect x="429" y="0" width="265" height="60" rx="4" class="row" />
    <circle cx="439" cy="14" r="4" class="ok" /><text x="449" y="18" class="body">single-agent loop · tool choice</text>
    <circle cx="439" cy="32" r="4" class="ok" /><text x="449" y="36" class="body">subagent.spawn() for parallel work</text>
    <text x="449" y="52" class="small">no router — model picks tools/skills</text>
    <rect x="696" y="0" width="244" height="60" rx="4" class="row" />
    <circle cx="706" cy="14" r="4" class="ok" /><text x="716" y="18" class="body">skill-trigger via description match</text>
    <circle cx="706" cy="32" r="4" class="ok" /><text x="716" y="36" class="body">Agent tool dispatches subagents</text>
    <text x="716" y="52" class="small">user-mediated when ambiguous</text>
  </g>

  <line x1="20" y1="710" x2="960" y2="710" stroke="#e2e8f0" />
  <text x="20" y="730" class="h2">What landed today (2026-04-26 — extends prior commits c3fe7fd, e248d82, 7d1fa55)</text>

