  <g transform="translate(20, 838)">
    <rect x="0" y="0" width="940" height="32" rx="4" class="row-alt" />
    <text x="10" y="20" class="small">
      <tspan font-weight="700" fill="#7c3aed">Tengu</tspan> is doctrinally sharp (LLM=heart · Open Brain / Karpathy LLM Wiki=brain · tools=hands) but light on agent-layer features —
      <tspan font-weight="700" fill="#0284c7">Hermes</tspan> wins on breadth (platforms, scheduler, self-improving skills, multi-tenant);
      <tspan font-weight="700" fill="#059669">PI/Cowork</tspan> wins on UX (artifacts, computer-use, MCP marketplace).
    </text>
