    <text x="247" y="76" class="small">top-3 hits w/ scores per planner call</text>
    <rect x="474" y="0" width="225" height="86" rx="4" class="col-tengu" />
    <circle cx="488" cy="14" r="4" class="new" />
    <text x="498" y="18" class="h3">Durable msg persistence</text>
