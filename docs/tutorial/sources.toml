# Tutorial sync map: each feature page → the source paths it explains.
# A path ending in `/` covers every file below it.
#
# After a code change, update every page whose `sources` lists the changed
# file or one of its parent directories (docs/tutorial/AUTHORING.md § Sync rule).
# `cargo test --test tutorial_map` fails when a src/ file is in no page and not
# in [glue], when a path here no longer exists, or when nav.js and this file
# disagree on the page list.

# Files that only declare modules: no behaviour of their own.
[glue]
sources = [
  "src/adapters/mod.rs",
  "src/adapters/inbound/mod.rs",
  "src/adapters/outbound/mod.rs",
  "src/application/mod.rs",
  "src/bootstrap/mod.rs",
  "src/domain/mod.rs",
  "src/ports/mod.rs",
]

