notes = "Hash-only public record (critic C13): ids, pins and sha256 only — the signed operator profile (its rank order included), capability baseline, eval and holdout labels, cycles, grades and episodes stay private under <TENGU_HOME>/state/soe/. Not frozen: the [[frozen]] row in locks.toml waits for the operator's signed profile and approved sources (G-O0) and the merge after G-WKND; `tengu lineage generation SOE-G0` prints the manifest digest to lock. Until then a change to a pinned section updates its pin here (verify --pins). [sources] and [egress] are not pinned: the operator fills the registry rows' reviewed terms before the freeze. No contact, spend, publish or deploy capability exists (O5–O8 wait for Operator Review #2)."

