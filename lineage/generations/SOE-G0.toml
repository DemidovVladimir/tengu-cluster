[decision_policy]
primary = "DETERMINISTIC"
summary = "domain::soe::allocate::decide_week: the O1 gates and three-scenario economics, the Critic's challenges merged toward the conservative side, then the one portfolio builder under the signed profile's weekly owner hours and validation tranche, ranked by the profile's rank order (private; its sha256 is each cycle's inputs.json policy_sha256). HOLD is a valid week; no LAUNCH action exists."

[research_policy]
summary = "Observe only the cycle's as-of evidence packet (captured clock live, knowable clock in replays). The Architect proposes mechanisms as data (soe_propose: no computed field, every cited id in the packet); a separate Critic challenges (soe_challenge). Each record stamped with agent, model, engine, skill sha256, generation and call id; each stage recorded by sha256 for byte-identical replays; forecasts frozen at the decision and graded by the operator (O4)."

