[decision_policy]
primary = "DETERMINISTIC"
summary = "Rule W, frozen: at Sun 18:00 New York fade every xyz stock perp's move since Fri 20:00 New York, exit Mon 09:00. The $100 capped account trades the 4 largest |s| ≥ 50 bps at $25 through the [risk] gate; a $10,000 shadow account trades every eligible name at $100 as a measurement. No LLM and no Jev in the forward path; every risk verdict is deterministic."

[[decision_policy.arms]]
name = "rule_w_top4_capped"
status = "BASELINE"
summary = "Account xmarket-weekend: top 4 |s| ≥ 50 bps, $25 each, [risk] gate (30 bps / $250 depth; a pick denied by the gate is not replaced). Forward 2026-10-02: +1.370036060021 USD, +141.8 bps a trade (n 4)."

[[decision_policy.arms]]
name = "rule_w_all_shadow"
status = "BASELINE"
summary = "Account xmarket-weekend-shadow: every eligible name, $100 each, 100 bps IOC bound, budget rules skipped (shadow gate). Forward 2026-10-02: +6.213796012 USD, +8.4 bps a trade (n 74)."

[[decision_policy.arms]]
name = "jev_gate"
status = "UNPROVEN"
summary = "Jev (typesafe/jev-1.13-20260917, [decision_loops.xl_gate]) decides take / skip per rule W candidate — research only, never forward: jev − rules +28.9 bps (CI −23.5 … +81.6), capped −25.4 (CI −113.5 … +63.8), Brier 0.349."

[research_policy]
summary = "History first (xlab): every hypothesis as a typed spec (data, never code) over backfilled market.db; split first (default time:2026-07-01T00:00:00Z), tune on the in-sample half only; the backtest tool hides a split's holdout until read with holdout: true and counts every read in holdout-reads.jsonl per spec_sha256 (CLI --split reads are not counted — inc.2026-10-05.weeknight-holdout-reads-uncounted); one holdout read per chosen variant; robustness on periods / instruments rows; report n, mean net bps, 95 % CI (seeded period bootstrap) and the run id (skill xlab-research). Forward tests preregistered and frozen before the anchor; M3 go for rule W: ≥ 12 weekends, mean ≥ +15 bps at executable prices, t ≥ 1.5, not carried by ≤ 2 weekends."

