# Tengu Cluster — DeSci Sandbox
# Multi-agent team for Decentralized Science workflows:
# PDF research → IPNFT minting → Molecule project → Beach.science publishing.
# Run with: tengu orchestrate --sandbox desci
# Or Telegram: tengu telegram --sandbox desci

runtime_profile = "cloud"

[hub]
bind = "127.0.0.1"
port = 7071

[memory]
enabled = true

[telegram]
tool_approvals = true
approve_only = ["sign_and_send_transaction"]

[orchestrator]
enabled = true
max_retries = 2
planner_engine = "openrouter"
planner_model = "anthropic/claude-sonnet-4.6"

# --- Scaffold ---
# Root workspace with working directories created at startup.
[scaffold]
root = "~/aura-workspace"
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

# Per-project template: applied by /project <name> inside {root}/{name}/
[scaffold.project]
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

[[scaffold.project.files]]
path = "README.md"
content = """# DeSci Project
- `poi/` — Proof of Invention registration
- `mint/` — Minting metadata and logs
- `create_molecule/` — Molecule project creation
- `uploads/` — Molecule data room uploads with s3 link upload
- `posts/` — Beach.science post records
"""

[agents.aura]
engine = "openrouter"
model = "anthropic/claude-sonnet-4.6"
role = "aura"
default = true
requires = []
workspace = "~/aura-workspace"
skill_packages = ["aura-orchestrator", "beach-science", "privy"]
workspace_tools = ["shared_cache"]

[agents.aura.limits]
# Each tool round resends full history — cumulative tokens exceed 100K default by ~round 10.
max_tokens_per_flow = 5_000_000
# Full pipeline is ~40+ tool calls (phases 0-7 + Beach posting). Default 30 is not enough.
max_tool_rounds = 100
# Timeout for individual stream events from OpenRouter (default 120).
stream_event_timeout_secs = 120
# Max chars per tool result before adaptive truncation kicks in (default 300_000).
max_tool_result_chars = 300_000
# Max chars for compacted tool results during 2-phase pruning (default 200).
compact_result_limit = 50_000

[agents.aura.identity]
name = "Aura DeSci Agent"
instructions = """You are the single DeSci agent handling the ENTIRE pipeline: wallet setup, document analysis, POI registration, IPNFT minting, Molecule project creation, file upload, announcements, Beach.science posting, and NFT transfer. You do ALL of these yourself — no other agent is needed for the pipeline.

## RULES
- NEVER use python, pip, pdftotext, or any external tool for PDF reading. Use `read_file` — it supports PDF extraction natively.
- NEVER guess or fabricate URLs, contract addresses, or function signatures. Follow the aura-orchestrator skill EXACTLY.
- Use `shared_cache` to persist ALL critical IDs (reservation_id, wallet_address, tx hashes, service tokens) so they survive context compaction.
- POI registration is an HTTP API call, NOT a smart contract call. Follow the skill.

## You have those capabilities, which need to be executed sequentially as one continuous flow without stopping or reporting intermediate progress:
0. Wallet Setup — verify Privy agentic wallet exists, create one with a policy if not (follow aura-orchestrator skill Phase 0)
1. POI Registration
2. IP-NFT Minting 
3. Authenticate — follow molecule-auth skill
4. Create project — follow molecule-project skill
5. Upload files to created project — follow molecule-upload skill
6. Create announcement in project — follow molecule-announcement skill
7. Transfer NFT to owner's wallet and add them as co-owner — follow aura-orchestrator skill
8. Post to Beach.science with project details and IPNFT metadata — follow beach-science skill

"""

