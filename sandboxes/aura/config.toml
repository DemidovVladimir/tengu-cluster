# Tengu Cluster — DeSci Sandbox
# Multi-agent team for Decentralized Science workflows:
# PDF research → IPNFT minting → Molecule project → Beach.science publishing.
# Run with: tengu orchestrate --sandbox desci
# Or Telegram: tengu telegram --sandbox desci

runtime_profile = "cloud"

[hub]
bind = "127.0.0.1"
port = 7071

[memory]
enabled = true

[telegram]
tool_approvals = true
approve_only = ["sign_and_send_transaction"]

# --- Tool scopes (fallback applied when an agent has no per-tool scope) ---
# The http_request tool refuses any host not on its allow-list. `"*"` is the
# wildcard used by the A1 permissive-scope migration window — safe for dev,
# tighten for production.
[default_scopes.http_request]
net_hosts = ["*"]
env_reads = ["*"]

# --- Scaffold ---
# Root workspace with working directories created at startup.
[scaffold]
root = "~/aura-workspace"
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

# Per-project template: applied by /project <name> inside {root}/{name}/
[scaffold.project]
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

[[scaffold.project.files]]
path = "README.md"
content = """# DeSci Project
- `poi/` — Proof of Invention registration
- `mint/` — Minting metadata and logs
- `create_molecule/` — Molecule project creation
- `uploads/` — Molecule data room uploads with s3 link upload
- `posts/` — Beach.science post records
"""

[agents.aura]
engine = "openrouter"
model = "anthropic/claude-sonnet-4-6"
role = "aura"
default = true
requires = []
workspace = "~/aura-workspace"
skill_packages = ["aura-orchestrator", "molecule-x402", "beach-science", "privy-agentic-wallets"]
workspace_tools = ["shared_cache"]

[agents.aura.limits]
# Each tool round resends full history — cumulative tokens exceed 100K default by ~round 10.
max_tokens_per_flow = 3_000_000
# Full pipeline is ~40+ tool calls (phases 0-7 + Beach posting). Default 30 is not enough.
max_tool_rounds = 120
stream_event_timeout_secs = 720
# Max chars per tool result before adaptive truncation kicks in (default 300_000).
max_tool_result_chars = 10_000
# Max chars for compacted tool results during 2-phase pruning (default 200).
compact_result_limit = 50_000
# Max chars per MCP bridge tool result returned to Claude Code CLI (default 50_000).
# Prevents unbounded context growth — Claude Code has no per-turn compaction.
max_mcp_result_chars = 10_000

[agents.aura.identity]
name = "Aura DeSci Agent"
instructions = """You are the single DeSci agent handling the ENTIRE pipeline: wallet setup, document analysis, POI registration, IPNFT minting, Molecule project creation, file upload, announcements, Beach.science posting, and NFT transfer. You do ALL of these yourself — no other agent is needed for the pipeline.

For general user questions that fall outside the DeSci pipeline — looking up prices, fetching facts from the web, quick research, or any simple question where an HTTP call would answer it — use the `http_request` tool freely. You are not locked to the pipeline; you can also be a helpful general-purpose agent when the user asks something off-topic."""
