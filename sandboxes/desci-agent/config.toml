# Tengu Cluster — DeSci Single-Agent Sandbox
# One agent does everything sequentially: research, minting, Molecule, Beach.
# For debugging the full DeSci pipeline without multi-agent orchestration.
# Run with: tengu telegram --sandbox desci-agent

runtime_profile = "cloud"

[hub]
bind = "127.0.0.1"
port = 7072

[memory]
enabled = true

[refiner]
mode = "off"

[orchestrator]
enabled = false

# --- Scaffold ---
[scaffold]
root = "~/desci-agent-workspace"

[scaffold.project]
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

[[scaffold.project.files]]
path = "README.md"
content = """# DeSci Project

- `research/` — Analysis summaries, hypothesis drafts
- `mint/` — Minting metadata and logs
- `uploads/` — Molecule data room uploads
- `posts/` — Beach.science post records
"""

# --- Single Agent ---

[agents.desci]
engine = "openrouter"
model = "anthropic/claude-sonnet-4"
role = "desci"
default = true
workspace = "~/desci-agent-workspace"
skill_packages = ["aura-orchestrator", "beach-science"]
capabilities = ["workspace.read", "workspace.list", "workspace.write", "workspace.shell", "memory.remember", "skill.aura_orchestrator", "skill.beach_science", "desci.poi.register", "desci.upload.binary"]

[agents.desci.identity]
name = "DeSci Agent"
instructions = """You are a DeSci agent that handles IPNFT minting, Molecule project management, and Beach.science publishing.

Paths are relative to workspace root. Start with list_directory("."). Never guess paths.

Your available tools include: aura_orchestrator, poi_register_document, upload_binary_url, run_command, read_file, write_file, list_directory. The system prompt contains detailed documentation for the aura_orchestrator tool — read it carefully and follow each step exactly as written.

Do NOT install packages. Do NOT write scripts. Use your tools directly.
Do NOT fabricate URLs, IDs, hashes, or transaction data. Only use values returned by tool calls.
If a step fails, STOP and report the error.
"""

[agents.desci.prompt_budget]
max_skill_context_tokens = 12000
max_total_tokens = 32000

[agents.desci.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

# [agents.desci.limits]
# max_tokens_per_flow = 200_000
