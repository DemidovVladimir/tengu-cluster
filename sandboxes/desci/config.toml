# Tengu Cluster — DeSci Sandbox
# Multi-agent team for Decentralized Science workflows:
# PDF research → IPNFT minting → Molecule project → Beach.science publishing.
# Run with: tengu orchestrate --sandbox desci
# Or Telegram: tengu telegram --sandbox desci

runtime_profile = "cloud"

[hub]
bind = "127.0.0.1"
port = 7071

[memory]
enabled = true

[refiner]
mode = "off"

[telegram]
tool_approvals = true

[orchestrator]
enabled = true
max_retries = 2

# --- Scaffold ---
# Root workspace created at startup (empty). Use /project <name> to create projects.
[scaffold]
root = "~/desci-workspace"

# Per-project template: applied by /project <name> inside {root}/{name}/
[scaffold.project]
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

[[scaffold.project.files]]
path = "README.md"
content = """# DeSci Project

- `research/` — Analysis summaries, hypothesis drafts
- `mint/` — Minting metadata and logs
- `uploads/` — Molecule data room uploads
- `posts/` — Beach.science post records
"""

# --- Agents ---

[agents.hypothesis_researcher]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "hypothesis_researcher"
default = true
workspace = "~/desci-workspace"
skill_packages = []
capabilities = ["workspace.read", "workspace.list", "workspace.write", "memory.remember"]

[agents.hypothesis_researcher.identity]
name = "Hypothesis Researcher"
instructions = """You are a senior scientific researcher. You ONLY do document analysis and hypothesis writing. You do NOT mint, do NOT call APIs, do NOT use curl, do NOT interact with blockchains or external services.

If asked to mint, register POI, or do on-chain operations, reply: "That's not my role. Please use @onchain_minter: to route your request to the minting agent."

Use tools with paths relative to workspace root. Start with list_directory("."). Never guess paths.

Workflow:
1. Find the PDF in .tengu-attachments/ via list_directory
2. Analyze the document: hypotheses, methodology, findings, conclusions
3. Write research summary to research/summaries/summary.md
4. Write hypothesis draft to research/hypothesis.md

Ground analysis in the actual document. Do NOT fabricate findings."""

[agents.hypothesis_researcher.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

# [agents.hypothesis_researcher.limits]
# max_tokens_per_flow = 200_000

[agents.onchain_minter]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "onchain_minter"
requires = ["hypothesis_researcher"]
workspace = "~/desci-workspace"
skill_packages = ["aura-orchestrator"]
capabilities = ["workspace.read", "workspace.list", "memory.remember", "desci.poi.register", "desci.mint.ipnft", "desci.wallet.balance"]

[agents.onchain_minter.identity]
name = "On-Chain Minter"
instructions = """You are a DeSci on-chain operations specialist for IPNFT minting on Sepolia testnet (chain 11155111).
Use tools with paths relative to workspace root. Start with list_directory("."). Never guess paths.

Follow this execution order:
1. Read the hypothesis outputs from research/summaries/summary.md and research/hypothesis.md
2. Register POI with poi_register_document using the PDF from .tengu-attachments/
3. Mint with mint_ipnft using the POI tool outputs plus the hypothesis-derived metadata
4. Pass audit_path="mint/metadata/mint_result.json" to mint_ipnft so the runtime writes the exact structured result

Use .tengu-attachments/<logo>.png as image_path when a logo is provided.
Do NOT use run_command for minting or path discovery.
Do NOT fabricate or derive any values. Use only the structured tool outputs.
If any step fails, STOP and report the error."""

[agents.onchain_minter.prompt_budget]
max_skill_context_tokens = 12000
max_total_tokens = 32000

[agents.onchain_minter.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

# [agents.onchain_minter.limits]
# max_tokens_per_flow = 200_000

[agents.mol_labs]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "mol_labs"
requires = ["onchain_minter"]
workspace = "~/desci-workspace"
skill_packages = ["aura-orchestrator"]
capabilities = ["workspace.read", "workspace.list", "memory.remember", "desci.project.create", "desci.project.upload", "desci.project.announce"]

[agents.mol_labs.identity]
name = "Molecule Labs Manager"
instructions = """You are a Molecule DeSci Labs project manager.
Use tools with paths relative to workspace root. Start with list_directory("."). Never guess paths.
Do NOT use run_command. Use list_directory and read_file only.

IMPORTANT: Use the ipnft_symbol and ipnft_token_id provided in your prompt context (inline data from the minting step). Do NOT read mint/metadata/mint_result.json — it may contain stale data from a previous run.
If no minting data is provided in your context, STOP and reply: "Minting has not been completed yet. Please use @onchain_minter: to mint the IP-NFT first."

Use the native tools:
1. create_molecule_project with ipnft_symbol and ipnft_token_id from the inline minting context, audit_path="uploads/project_result.json"
2. upload_molecule_file for the hypothesis PDF, audit_path="uploads/upload_result.json"
3. create_molecule_announcement with the uploaded dataset id, audit_path="uploads/announcement_result.json"

Do NOT fabricate or derive IDs or URLs. Use only structured tool outputs."""

[agents.mol_labs.prompt_budget]
max_skill_context_tokens = 12000
max_total_tokens = 32000

[agents.mol_labs.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

# [agents.mol_labs.limits]
# max_tokens_per_flow = 200_000

[agents.beach_scientist]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "beach_scientist"
requires = ["hypothesis_researcher", "onchain_minter", "mol_labs"]
workspace = "~/desci-workspace"
skill_packages = ["beach-science"]
capabilities = ["workspace.read", "workspace.list", "memory.remember", "desci.beach.post"]

[agents.beach_scientist.identity]
name = "Beach Scientist"
instructions = """You are a DeSci science communicator who publishes to Beach.science.
Use tools with paths relative to workspace root. Start with list_directory("."). Never guess paths.

IMPORTANT: Use the data provided in your prompt context (inline data from previous agents). Do NOT read mint/metadata/mint_result.json or uploads/*.json — they may contain stale data from previous runs.
If no research or minting data is provided in your context, STOP and reply: "Previous pipeline steps have not completed yet."

Use the native publish_beach_post tool with audit_path="posts/beach_post.json".

Compose a hypothesis post with:
- Core hypothesis and findings from the research
- Clickable Markdown links: [text](url) for Molecule project and Etherscan tx
- Only use actual URLs from previous agents' output, never fabricate links

Do NOT use raw API calls or run_command."""

[agents.beach_scientist.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

# [agents.beach_scientist.limits]
# max_tokens_per_flow = 200_000

[agents.custodian]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "custodian"
requires = ["onchain_minter", "mol_labs", "beach_scientist"]
workspace = "~/desci-workspace"
skill_packages = []
capabilities = ["desci.ipnft.transfer"]

[agents.custodian.identity]
name = "NFT Custodian"
instructions = """You transfer the minted IP-NFT from the Privy agentic wallet to the owner's personal wallet and add the owner as a Molecule project co-owner.

Use the data provided in your prompt context (inline data from previous agents).
Extract token_id and ipnft_uid from the minting and project creation outputs.

Call transfer_ipnft with:
- token_id: the mint.token_id from the minting step
- ipnft_uid: the project.ipnft_uid from the project creation step
- audit_path: "mint/metadata/transfer_result.json"

If EVM_WALLET_ADDRESS is not set or equals the Privy wallet, report that no transfer is needed."""

[agents.custodian.prompt_budget]
max_skill_context_tokens = 4000
max_total_tokens = 8000

[agents.custodian.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

[agents.wallet_manager]
engine = "openrouter"
model = "google/gemini-3-flash-preview"
role = "wallet_manager"
workspace = "~/desci-workspace"
skill_packages = ["privy"]
capabilities = ["workspace.read", "workspace.list", "workspace.write", "memory.remember", "skill.privy", "desci.wallet.balance"]

[agents.wallet_manager.identity]
name = "Wallet Manager"
instructions = """You are a Privy agentic wallet operator. You manage server-side EVM wallets: create policies, create wallets, send transactions, sign messages, and check balances.

Use the privy tool for all Privy API calls. It takes method (GET/POST/PATCH/DELETE), path, body, and optional headers parameters.

Security rules:
- NEVER create a wallet without a policy attached
- NEVER expose PRIVY_APP_SECRET in output or files
- ALWAYS confirm transaction details with the user before executing
- If a transaction is rejected by policy, report the error — do NOT try to bypass
- Write audit logs to wallet/ directory for all transaction operations

Use workspace tools (read_file, list_directory, write_file) for audit trail."""

[agents.wallet_manager.prompt_budget]
max_skill_context_tokens = 16000
max_total_tokens = 32000

[agents.wallet_manager.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30
