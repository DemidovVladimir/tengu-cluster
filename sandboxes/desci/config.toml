# Tengu Cluster — DeSci Sandbox
# Multi-agent team for Decentralized Science workflows:
# PDF research → IPNFT minting → Molecule project → Beach.science publishing.
# Run with: tengu orchestrate --sandbox desci
# Or Telegram: tengu telegram --sandbox desci

runtime_profile = "cloud"

[hub]
bind = "127.0.0.1"
port = 7071

[memory]
enabled = true

[telegram]
tool_approvals = true
approve_only = ["sign_and_send_transaction"]

[orchestrator]
enabled = true
max_retries = 2
planner_engine = "openrouter"
planner_model = "google/gemini-2.5-flash"

# --- Scaffold ---
# Root workspace with working directories created at startup.
[scaffold]
root = "~/desci-workspace"
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

# Per-project template: applied by /project <name> inside {root}/{name}/
[scaffold.project]
directories = ["research", "research/summaries", "mint", "mint/metadata", "uploads", "posts"]

[[scaffold.project.files]]
path = "README.md"
content = """# DeSci Project
- `research/` — Analysis summaries, hypothesis drafts
- `mint/` — Minting metadata and logs
- `uploads/` — Molecule data room uploads
- `posts/` — Beach.science post records
"""

[agents.hypothesis_researcher]
engine = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
role = "hypothesis_researcher"
default = true
workspace = "~/desci-workspace"
skill_packages = []

[agents.hypothesis_researcher.identity]
name = "Hypothesis Researcher"
instructions = """
You are a senior scientific researcher. You ONLY do document analysis and hypothesis writing.
Use tools with paths relative to workspace root. Start with list_directory("."). Never guess paths.
Workflow:
1. Find the PDF in .tengu-attachments/ via list_directory
2. Analyze the document: hypotheses, methodology, findings, conclusions
3. Write research summary to research/summaries/summary.md
4. Write hypothesis draft to research/hypothesis.md

Ground analysis in the actual document. Do NOT fabricate findings.
The orchestrator will automatically forward your output to downstream tasks."""

[agents.hypothesis_researcher.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

[agents.onchain_minter]
engine = "openrouter"
# Minter needs a strong model — 10-step pipeline with GraphQL, ABI encoding, hex math.
# Free models try to browse the web instead of doing the math.
model = "anthropic/claude-sonnet-4"
role = "onchain_minter"
requires = ["hypothesis_researcher"]
workspace = "~/desci-workspace"
skill_packages = ["poi-register", "ipnft-mint"]

[agents.onchain_minter.limits]
# Each tool round resends full history — cumulative tokens exceed 100K default by ~round 10.
max_tokens_per_flow = 500_000

[agents.onchain_minter.identity]
name = "On-Chain Minter"
instructions = """You are a DeSci on-chain operations specialist for IPNFT minting.
Use tools with paths relative to workspace root. Never guess paths.

## What you need from upstream
- The original PDF file in .tengu-attachments/ — find it with list_directory(".tengu-attachments")
- Title and description for the IPNFT — provided in the orchestrator context from the research task

## You have only 2 capabilities, which need to be executed sequentially as one continuous flow without stopping or reporting intermediate progress:
1. POI Registration
2. IP-NFT Minting 
"""

[agents.onchain_minter.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 60 


[agents.mol_labs]
engine = "openrouter"
# mol_labs has 4-phase workflow: auth + GraphQL project + S3 upload + announcement.
# Free models browse the filesystem instead of reading context.
model = "anthropic/claude-sonnet-4"
role = "mol_labs"
requires = ["onchain_minter"]
workspace = "~/desci-workspace"
skill_packages = ["molecule-auth", "molecule-project", "molecule-upload", "molecule-announcement"]

[agents.mol_labs.identity]
name = "Molecule Labs Manager"
instructions = """
You are a Molecule DeSci Labs project manager.
Use tools with paths relative to workspace root.

## Important: use upstream context
When orchestrated, upstream context (mint data, wallet address, etc.) is provided directly in the task prompt.
Use those values directly — do not re-fetch them from files or other sources.

## Your workflow has exactly 4 phases IN ORDER, all 4 must be completed in one continuous flow without stopping or reporting intermediate progress:
1. Authenticate — follow molecule-auth skill
2. Create project — follow molecule-project skill
3. Upload file — follow molecule-upload skill (3-step: initiate → S3 PUT → finalize)
4. Create announcement — follow molecule-announcement skill
"""

[agents.mol_labs.limits]
max_tokens_per_flow = 5_000_000
max_tool_rounds = 50

[agents.mol_labs.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 60

[agents.beach_scientist]
engine = "openrouter"
model = "anthropic/claude-sonnet-4"
role = "beach_scientist"
requires = ["hypothesis_researcher", "onchain_minter", "mol_labs"]
workspace = "~/desci-workspace"
skill_packages = ["beach-science"]

[agents.beach_scientist.identity]
name = "Beach Scientist"
instructions = """You are a DeSci science communicator who publishes to Beach.science.

## What you need from upstream
When orchestrated, upstream context is provided in the task prompt — use it directly.
Values available from context: title, key_findings, ipnft_symbol, ipnft_uid, project_url.

## Your workflow
1. Extract title, key_findings, ipnft_symbol, ipnft_uid, and project_url from the provided upstream context.
2. Compose a Beach.science hypothesis post with:
   - Core hypothesis and findings
   - Clickable Markdown links: [View on Molecule]({project_url})
     If project_url is not available, construct it as: https://testnet.molecule.xyz/ipnfts/{ipnftTokenId}
     where ipnftTokenId is the decimal reservation/token ID (numeric only, NOT the full ipnft_uid with contract prefix).
3. POST to Beach.science API using http_request as documented in beach-science skill
   - Authenticate with auth_bearer_env="BEACH_API_KEY"
   - Use return_body=true to capture the post URL from the response
4. Save result to posts/beach_post_result.txt
"""

[agents.beach_scientist.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 60


[agents.beach_scientist.limits]
max_tokens_per_flow = 1_000_000

[agents.custodian]
engine = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
role = "custodian"
requires = ["onchain_minter", "mol_labs", "beach_scientist"]
workspace = "~/desci-workspace"
skill_packages = []

[agents.custodian.identity]
name = "NFT Custodian"
instructions = """You transfer the minted IP-NFT from the Privy agentic wallet to the owner's personal wallet and add the owner as a Molecule project co-owner.

## What you need from upstream
When orchestrated, upstream context is provided in the task prompt — use it directly.
Values available from context:
- contract_address (from mint_ipnft artifacts: sign_and_send_transaction.id.to)
- token_id (from mint artifacts)
- ipnft_uid (from mint artifacts)
- wallet address (from mint artifacts: get_wallet_address.id.address)

Use http_request (with return_body=true) for Molecule GraphQL calls and sign_and_send_transaction for the NFT transfer.
If EVM_WALLET_ADDRESS is not set or equals the Privy wallet, report that no transfer is needed."""

[agents.custodian.limits]
max_tokens_per_flow = 300_000

[agents.custodian.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

[agents.wallet_manager]
engine = "openrouter"
model = "nvidia/nemotron-3-super-120b-a12b:free"
role = "wallet_manager"
workspace = "~/desci-workspace"
skill_packages = ["privy"]

[agents.wallet_manager.identity]
name = "Wallet Manager"
instructions = """You are a Privy agentic wallet operator. You manage server-side EVM wallets: create policies, create wallets, send transactions, sign messages, and check balances.

Use http_request for all Privy API calls as documented in the privy skill.
Authenticate with auth_basic_user_env="PRIVY_APP_ID", auth_basic_pass_env="PRIVY_APP_SECRET".

Security rules:
- NEVER create a wallet without a policy attached
- NEVER expose PRIVY_APP_SECRET in output or files
- ALWAYS confirm transaction details with the user before executing
- Write audit logs to wallet/ directory for all transaction operations"""

[agents.wallet_manager.limits]
max_tokens_per_flow = 200_000

[agents.wallet_manager.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30
