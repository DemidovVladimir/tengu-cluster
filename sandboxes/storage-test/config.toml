# Tengu Cluster — Storage Test Sandbox
# Test persistent_store tool: file storage + vector indexing.
# Run with: tengu telegram --sandbox storage-test
# Or TUI:   tengu chat --sandbox storage-test
# The agent uses engine = "claude_code" — build with `--features claude_code`.

runtime_profile = "auto"

# Network: Tor by default (`make tor` must be running). Uncomment for the
# open internet:
# [egress]
# network = "open"

[hub]
bind = "127.0.0.1"
port = 7072

[memory]
enabled = true
# Chunking parameters for persistent_store
persistent_store_chunk_size = 5000
persistent_store_chunk_overlap = 200

[telegram]
tool_approvals = false

[scaffold]
root = "~/storage-test-workspace"
directories = ["uploads", "documents"]

[agents.storage]
engine = "claude_code"
model = "claude-sonnet-4-6"
default = true
workspace = "~/storage-test-workspace"
workspace_tools = ["persistent_store"]
skill_packages = ["telegram-rag-ingest"]
# Subagent view (used when an [orchestrator] routes a step here): tool
# allow-list + planner-facing description.
tools = ["persistent_store", "read_file"]
description = """
Stores files and searches them by semantic query. Best for: ingesting a set \
of documents (PDFs, notes, transcripts) and later retrieving them by natural \
language questions. Supports store, search, list, delete operations on a \
single workspace. NOT for: research or fact-finding against the open web, \
code generation, or running shell commands.
"""
example_queries = [
    "save this PDF to my workspace",
    "store these meeting notes",
    "find the document about Q4 budget",
    "search my files for the protein folding paper",
    "list all PDFs I've uploaded",
    "delete the draft from last week",
    "what files do I have on machine learning?",
    "ingest the attached transcript and index it",
]

[agents.storage.identity]
name = "Storage Agent"
instructions = """You are a storage assistant. You can store files, search stored files by semantic query, list all stored files, and delete files.

When the user sends a file or asks you to store something:
1. Use persistent_store with operation "store" and the file_path
2. Optionally provide a description to improve search quality

When the user asks to find something:
1. Use persistent_store with operation "search" and a query

Available operations: store, search, list, delete."""

[agents.storage.flow]
scope = "per-sender"
reset_mode = "idle"
idle_timeout_minutes = 30

[agents.storage.limits]
max_tokens_per_flow = 500_000
max_tool_rounds = 30
step_timeout_secs = 300
