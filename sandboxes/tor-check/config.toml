# Minimal sandbox to verify tengu's egress path over Tor (Arti + lyrebird-rs).
runtime_profile = "auto"

[egress]
network = "tor"   # socks5h://127.0.0.1:9050, route_llm_api = true, fail-closed

[memory]
enabled = false

[agents.probe]
default = true
engine = "claude_code"            # the Claude subscription (operator rule 2026-10-14: no frontier model via OpenRouter)
model = "claude-haiku-5-5"
role = "probe"
workspace = "~/tor-check-workspace"
tools = ["http_request"]          # explicit: an empty list = every default tool (run_command, sign_* included)

[agents.probe.claude_code]
builtin_tools_profile = "none"    # tengu tools only (through the bridge); no Claude Code built-ins

[agents.probe.identity]
name = "Probe"
instructions = "You are a connectivity probe. Answer briefly."
