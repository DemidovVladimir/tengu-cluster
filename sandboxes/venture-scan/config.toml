# Tengu Cluster — "venture-scan" sandbox (2026-10-14)
# Open-web research on business opportunities, one lane (a niche) at a time,
# on the operator's SUBSCRIPTIONS only — no OpenRouter, no per-token spend:
#
#   web_scout    (Claude Code, Claude plan) — WebSearch at Anthropic + http_request
#   social_scout (Claude Code, Claude plan) — X / Reddit / HN through search + public JSON APIs
#   critic       (Codex CLI, ChatGPT plan, live web search at OpenAI) — challenges and writes the dossier
#
# No planner: a driver outside the repo (~/tengu-lab/venture-scan/driver.sh)
# calls each agent over A2A in order (scout(s) → critic) and saves the dossier.
# Modelled on sandboxes/soe (one side proposes, the critic challenges),
# without its gates. Research only: no write, contact, spend or publish tool.
#
#   export TENGU_VENTURE_SCAN_TOKEN=$(openssl rand -hex 24)
#   tengu a2a serve --sandbox venture-scan          # the long-running process
#   tengu a2a send --sandbox venture-scan --remote web_scout "<lane brief>"
#
# Build with --features claude_code (codex is on by default); `claude` and
# `codex` logged in. Privacy: the scouts fetch arbitrary pages, so their
# prompts carry no private figures; only the critic (no fetch tool) gets the
# operator's private brief, which lives outside the repo.

# Open: WebSearch and Codex web search run at the providers; http_request
# fetches pages directly (switchable to Tor — the Claude CLI then gets the
# proxy env, and http_request goes through egress.rs either way).
[egress]
network = "open"

[memory]
enabled = false

# --- Scouts: Claude Code on the Claude subscription -----------------------
[agents.web_scout]
default = true
engine = "claude_code"            # build with --features claude_code
model = "claude-sonnet-5-5"       # bare slug for claude_code
description = """
Web scout: researches ONE business niche on the open web — demand evidence, who
pays and how much, competitors, verified revenue, base rates for a new entrant,
German/EU legal facts. Returns an evidence table where every row has a URL and a
date."""
example_queries = ["Research the market for independent Solana smart-contract audits: rates, demand, competitors, sources."]
tools = ["http_request"]

[agents.web_scout.claude_code]
builtin_tools_profile = "research"   # WebSearch only; pages via http_request

[agents.web_scout.identity]
name = "web scout"
instructions = """You research one business niche for a senior software engineer. Use WebSearch to find
sources and http_request (GET, url + headers only) to read pages or public JSON APIs. Every claim
carries a source URL and a date; prefer the last 12 months; say "unknown" instead of guessing.
Separate what the top 1% earn from what a median new entrant earns. Your reply is the whole
evidence table."""

[agents.web_scout.limits]
max_tool_rounds = 40              # claude_code counts tool calls (WebSearch included)
step_timeout_secs = 1500
stream_event_timeout_secs = 600

[agents.social_scout]
engine = "claude_code"
model = "claude-sonnet-5-5"
description = """
Social scout: what builders, buyers and critics on X (Twitter), Reddit, Hacker
News and Indie Hackers said about ONE niche in the last 30-90 days — verified
revenue posts, complaints, prices, hype, incidents — with post URLs."""
example_queries = ["What do indie developers say about selling Claude Code skills? Cite posts."]
tools = ["http_request"]

[agents.social_scout.claude_code]
builtin_tools_profile = "research"

[agents.social_scout.identity]
name = "social scout"
instructions = """You read social signal for one niche: WebSearch with site:x.com, site:reddit.com,
site:news.ycombinator.com and site:indiehackers.com queries, and http_request (GET) on the Hacker News
Algolia API (hn.algolia.com/api/v1/search) and Reddit JSON (www.reddit.com/r/<sub>/search.json).
Mark revenue claims verified (dashboard, Stripe screenshot, public filing) or unverified. Every
bullet cites its URL. Your reply is all the bullets."""

[agents.social_scout.limits]
max_tool_rounds = 30
step_timeout_secs = 1200
stream_event_timeout_secs = 600

# --- Critic: Codex on the ChatGPT subscription ------------------------------
[agents.critic]
engine = "codex"
model = "gpt-5.6-sol"            # a model this ChatGPT login serves (gpt-5.5 is refused)
description = """
Critic and editor: takes a lane's scout notes, challenges every load-bearing
number against base rates (live web search to check), flags legal/regulatory
risk for a Berlin-based founder (Germany/EU), and writes the final lane dossier
with every URL kept."""
example_queries = ["Challenge these research notes and write the lane dossier."]
tools = ["read_file"]
workspace = "~/tengu-lab/venture-scan/ws"

[agents.critic.codex]
sandbox = "read-only"
web_search = "live"               # at OpenAI, on the subscription

[agents.critic.identity]
name = "critic"
instructions = """You are a skeptical ex-founder and auditor. You receive research notes in the message.
Challenge every number that carries the conclusion (use web search to check the important ones);
lower anything that assumes a top-1% outcome; flag German/EU legal issues (side-business rules while
employed, false self-employment, MiCA/BaFin, EU sanctions, creator law, tax). Never invent a source;
keep every URL from the notes. Write no preamble: your reply IS the dossier, in Markdown tables."""

[agents.critic.limits]
step_timeout_secs = 1800

# --- Tool scopes -------------------------------------------------------------
# http_request: the scouts read pages a search found, so any https host; no
# env reads (a "$SECRET" in a URL stays literal), no fs roots (no uploads).
[default_scopes.http_request]
net_hosts = ["*"]

[default_scopes.read_file]
fs_roots = ["~/tengu-lab/venture-scan/ws"]

# --- The process: A2A server (agents only, no planner) ----------------------
[a2a.server]
port = 8720
token_env = "TENGU_VENTURE_SCAN_TOKEN"
name = "tengu venture-scan"
description = "Business-opportunity lane research on the Claude and ChatGPT subscriptions."
orchestrator = false
agents = ["web_scout", "social_scout", "critic"]
max_running = 3
run_timeout_secs = 3600

[a2a.remotes.web_scout]
url = "http://127.0.0.1:8720/a2a/agents/web_scout"
description = "The web scout."
bearer_env = "TENGU_VENTURE_SCAN_TOKEN"
timeout_secs = 3600
max_result_chars = 200000

[a2a.remotes.social_scout]
url = "http://127.0.0.1:8720/a2a/agents/social_scout"
description = "The social scout."
bearer_env = "TENGU_VENTURE_SCAN_TOKEN"
timeout_secs = 3600
max_result_chars = 200000

[a2a.remotes.critic]
url = "http://127.0.0.1:8720/a2a/agents/critic"
description = "The critic."
bearer_env = "TENGU_VENTURE_SCAN_TOKEN"
timeout_secs = 3600
max_result_chars = 200000
