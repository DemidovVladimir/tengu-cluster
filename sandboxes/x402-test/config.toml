# Tengu Cluster — x402 Test Sandbox
# Minimal sandbox to validate x402 payment flow against x402-hello-hono server.
#
# Prerequisites:
#   - Claude Code CLI installed and authenticated
#   - x402-hello-hono server running: cd ~/development/x402-hello-hono && bun dev
#   - Privy wallet with USDC on Base Sepolia
#   - cargo build --features claude_code
#
# Run with: tengu chat --config sandboxes/x402-test/config.toml
# Or:       tengu telegram --sandbox x402-test

runtime_profile = "desktop"

[hub]
bind = "127.0.0.1"
port = 7073

[claude_code]
cli_path = "claude"
timeout_secs = 120

[memory]
enabled = false

[telegram]
tool_approvals = true
approve_only = ["sign_and_send_transaction"]

# --- Scaffold ---
[scaffold]
root = "~/x402-test-workspace"
directories = ["results"]

[agents.x402]
engine = "claude_code"
model = "opus"
role = "x402"
default = true
requires = []
workspace = "~/x402-test-workspace"
skill_packages = ["x402-hello", "privy", "molecule-x402", "aura-orchestrator"]
workspace_tools = ["shared_cache"]

[agents.x402.claude_code]
builtin_tools_profile = "editor_shell"

[agents.x402.limits]
max_tokens_per_flow = 2_000_000
max_tool_rounds = 100
stream_event_timeout_secs = 120
max_tool_result_chars = 300_000
compact_result_limit = 50_000

[agents.x402.identity]
name = "x402 Test Agent"
instructions = """You are a test agent that validates the x402 payment protocol.

## What you do
When the user asks you to test x402, follow the x402-hello skill EXACTLY:
1. Send GET to $X402_HELLO_URL/hello — expect 402 with payment-required header
2. Decode the payment requirements from the base64 header
3. Get your wallet address
4. Generate nonce, validAfter, and validBefore
5. Sign EIP-712 TransferWithAuthorization via Privy
6. Build the v2 payment header (base64-encoded JSON with resource + accepted)
7. Retry the request with PAYMENT-SIGNATURE header — expect 200 with "hello world"

## Rules
- Follow the x402-hello skill step by step. Do not skip steps. Do not deviate from the skill.
- Do NOT install npm packages or read library source code. The skill has all the information you need.
- Use `run_command` with curl (including -i flag) for HTTP requests that need response headers.
- Use `http_request` for the Privy signing call.
- All authorization fields (value, validAfter, validBefore) must be STRINGS, not numbers.
- The `accepted` field in the payment header must be an exact copy of `accepts[0]` from the 402 response.
- Report the full result: whether payment was accepted, the response body, and any errors.
- Save the final result to `results/x402_test.json`.
"""
