net_hosts = ["api.hyperliquid.xyz", "api.geckoterminal.com"]
env_reads = ["HL_API_URL", "GECKO_API_URL"]

[default_scopes.backtest]
fs_roots = ["~/xlab-w2-ws"]

# --- Request budgets ---------------------------------------------------------
# HL allows 1200 weight / min per IP, shared with xmarket-weekend (peaks near
# 190 / min) and xmarket (≈ 110 / min) when they run on this host. A 1h backfill
# of the 75 xyz names asks ≈ 34 000 weight (candles 20 + 1 per 60 bars, funding
# 20 a page): at 1200 / min it took HL's whole per-IP budget for 27 min (the
# weekend run's book reads would get 429s); at 600 / min it takes ≈ 1 h. burst
# 200: no 60 s window passes 800 (200 + 600), so 800 + 190 + 110 < 1200 even with
# both xmarket sandboxes up. Budgets are per process: one HL-heavy xlab process
# (backfill, backtest --fetch, an Architect fetching) at a time.
[rate_limits.hyperliquid]
per_minute = 600
burst = 200

[rate_limits.geckoterminal]
per_minute = 25                  # free API: ~30 calls / min

# W2: SEC EDGAR fair access is 10 requests / s per host with a declared
# User-Agent (SEC_USER_AGENT); 5 / s here leaves room for a second process.
[rate_limits.sec]
per_minute = 300
burst = 5
