# Share splits: a run divides the loaded bars closed before `at` by `ratio`
# (volume × ratio), drops a bar straddling `at` (a 1d bar here) and says so in
# report.md's data notes. KIOXIA 3-for-1, verified in
# market.db: the 07:00 UTC bar of 2026-09-28 is a no-trade halt at 340.79, the
# 08:00 bar opens at 114.93 (340.79 / 113.9 ≈ 2.99).
[backtest.splits]
"hyperliquid:xyz:KIOXIA" = [{ at = "2026-09-28T08:00:00Z", ratio = 3.0 }]

# Rule W exactly (docs/xmarket-feasibility-2026-09-30.md): Sun 18:00 NY fade the
# move since Fri 20:00, exit Mon 09:00 — every eligible name (the shadow ledger).
[backtest.strategies.weekend_fade]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 0

# Rule W on liquid entries only: a name whose entry hour (the bar closing Sun
# 18:00 NY) counted < 50 trades is skipped (`thin_entry`). HL keeps no-trade
# hours as flat bars at the previous close (n = 0) — stale prices; thin xyz
# names have hundreds (xyz:DKNG 1 278 of 4 561 hourly bars). The feasibility
# study's "entry bars with ≥ 50 trades" cut.
[backtest.strategies.weekend_fade_liquid]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 0
min_entry_trades = 50

# The capped ledger's selection: the 4 largest |s| ≥ 50 bps.
[backtest.strategies.weekend_fade_top4]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 50
top_n = 4

