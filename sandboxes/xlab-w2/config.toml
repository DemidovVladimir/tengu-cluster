#   BMNR / MSTR / PURRDAT (W1 assumed 0.9 for all — defect D8).
# half_spread: the measured cost of a $100 order per side (half-spread + impact,
#   hl_book/1 buy / sell slippage at notional 100) averaged over the rule W entry
#   (Sun 18:00 ET) and exit (Mon 09:00 ET) of 2026-10-04 / 05 — OBSERVED on one
