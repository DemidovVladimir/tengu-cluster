# Tengu Cluster — "xlab-w2" sandbox (2026-10-08): W2 research (TENGU_ROADMAP Phase 7+)
# A copy of sandboxes/xlab WITHOUT the W1 binding — W1 stays frozen there; this
# sandbox shares its state dir (market.db, backtests/) and adds what W2 research
# needs: SEC EDGAR filings (Phase 7, `tengu history events`). Phase 10 binds it
# to the W2 candidate generation. Everything below the [xmarket] section is
# xlab's as of 2026-10-08 unless marked W2.
#
# Original xlab header:
# History-first adaptive trading harness — the operator's PRD v0.5 (Architect +
# TypeSafe JEV + deterministic layer + risk + paper) on Hyperliquid / HIP-3,
# Solana and Robinhood Chain. Every question is answered from backfilled
# history first; nothing here waits for live recording. Doc:
# docs/xlab-2026-10-01.md.
#
# QUICKSTART — from the repo root (`--sandbox` resolves sandboxes/<name>/ from
# the cwd; the repo .env sets TENGU_HOME=~/.tengu). Enter skips the vault prompt.
# Models: the Architect is Opus and xl_jev Sonnet on the Claude CLI (the operator's
# login: build with `--features claude_code`, `claude` logged in); Jev is the only
# OpenRouter model (OPENROUTER_API_KEY).
#   0. build     CARGO_TARGET_DIR=$HOME/.cache/tengu-xm.noindex/main cargo build --release --features claude_code
#                tengu doctor --sandbox xlab --engines   (one small CLI turn per agent)
#   1. data     tengu history backfill --sandbox xlab --instruments @xyz_stocks --interval 1h --from 2026-03-01 --funding
#                tengu history backfill --sandbox xlab --instruments @crypto --interval 1h --from 2026-03-01 --funding
#                tengu history coverage --sandbox xlab
#                (≈ 1 h for the 75 names: [rate_limits.hyperliquid] leaves room for a
#                weekend run on the same IP — see the budget note at the end)
#   2. rules     tengu backtest --sandbox xlab --strategy weekend_fade --split time:2026-07-01
#   3. + Jev     tengu backtest --sandbox xlab --strategy weekend_fade_top4 --gate --max-decisions 200
#                (rerun with --offline: the same decisions from the cache, nothing called)
#   4. Architect tengu chat --sandbox xlab      ("test a weekend follow placebo on the holdout split")
#                (its backtest calls show the in-sample half of a split; a holdout
#                read is "holdout": true, counted in backtests/holdout-reads.jsonl)
# State: ~/.tengu/state/xlab/ (market.db, backtests/<run>/, ledger.db, KILL = halt);
# workspace ~/xlab-w2-ws (only .tengu/observations.db).

runtime_profile = "auto"

# --- Network: open now, switchable to Tor (every transport through egress.rs) --
# Tool ceiling = the history hosts; LLM / Jev API traffic is separate (proxy only).
[egress]
network = "open"
allow_hosts = ["api.hyperliquid.xyz", "api.geckoterminal.com", "www.sec.gov", "data.sec.gov"]   # W2: + SEC EDGAR (Phase 7)
https_only = true

[memory]
enabled = false

# --- Generation: none yet (unbound research); Phase 10 binds W2-CANDIDATE. ----

# --- xmarket state dir + calendars --------------------------------------------
[xmarket]
state = "xlab"

# NYSE (same as sandboxes/xmarket-weekend).
[xmarket.calendars.us_equity]
kind = "exchange"
tz = "America/New_York"
core = ["09:30", "16:00"]
pre = "04:00"
post = "20:00"
overnight = true
early_close = "13:00"
early_post = "17:00"
holidays = [
    "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
    "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
    "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
    "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
    "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
    "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
]
early_closes = ["2026-11-27", "2026-12-24", "2027-11-26", "2028-07-03", "2028-11-24"]

# --- Backtests: the deterministic layer + the strategy library ----------------
# Specs = the Architect's level-2 capabilities (docs/xlab-2026-10-01.md § 5):
# data, never code. The Architect proposes new ones through the `backtest` tool.
[backtest]
notional_usd = 100               # research arm: every candidate at $100
bootstrap = 2000
seed = 7
gate = "xl_gate"
# Keep every run dir: this sandbox is unbound (no [generation]), so retention
# cannot see the runs lineage/ cites, and it shares the `xlab` state dir that
# holds the W1-cited run dirs (`run:xlab/<id>`). 0 = never prune.
keep_runs = 0

# Costs per side, longest id prefix wins (§ 6). xyz: the feasibility study's
# 3.8 bps round trip (0.9 fee growth mode + 1.0 half-spread); main-dex perps:
# tier-0 taker 4.5 bps + archive impact spread when imported; DEX tokens:
# pool fee + a bar-estimated spread (RH tokens cost 30–220 bps round trip).
[backtest.costs."hyperliquid:xyz:"]
taker_fee_bps = 0.9
half_spread = { model = "fixed", bps = 1.0 }

# --- W2 cost model v2 (Phase 9, 2026-10-08): per name, longest prefix wins --------
# taker_fee_bps: OBSERVED — mkt_ctx/1 taker_fee_bps at 2026-10-04T22:00Z (vault
