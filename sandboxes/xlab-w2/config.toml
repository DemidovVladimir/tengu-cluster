# The xlab tools: market.db + backtests/ are their own state in ~/.tengu/state/xlab
# (outside every fs root); fs_roots = the workspace (observation rows);
# market_history fetch = true reads HL / GeckoTerminal; backtest has no network.
[default_scopes.market_history]
