# Tengu Cluster — "xlab" sandbox (2026-10-01)
# History-first adaptive trading harness — the operator's PRD v0.5 (Architect +
# TypeSafe JEV + deterministic layer + risk + paper) on Hyperliquid / HIP-3,
# Solana and Robinhood Chain. Every question is answered from backfilled
# history first; nothing here waits for live recording. Doc:
# docs/xlab-2026-10-01.md.
#
# QUICKSTART — from the repo root (`--sandbox` resolves sandboxes/<name>/ from
# the cwd; the repo .env sets TENGU_HOME=~/.tengu). Enter skips the vault prompt.
#   1. data      tengu history backfill --sandbox xlab --instruments @xyz_stocks --interval 1h --from 2026-03-01 --funding
#                tengu history backfill --sandbox xlab --instruments @crypto --interval 1h --from 2026-03-01 --funding
#                tengu history coverage --sandbox xlab
#   2. rules     tengu backtest --sandbox xlab --strategy weekend_fade --split time:2026-07-01
#   3. + Jev     tengu backtest --sandbox xlab --strategy weekend_fade_top4 --gate xl_gate --max-decisions 300
#   4. Architect tengu chat --sandbox xlab      ("test a weekend follow placebo on the holdout split")
# State: ~/.tengu/state/xlab/ (market.db, backtests/<run>/, ledger.db, KILL = halt);
# workspace ~/xlab-ws (only .tengu/observations.db).

runtime_profile = "auto"

# --- Network: open now, switchable to Tor (every transport through egress.rs) --
# Tool ceiling = the history hosts; LLM / Jev API traffic is separate (proxy only).
[egress]
network = "open"
allow_hosts = ["api.hyperliquid.xyz", "api.geckoterminal.com"]
https_only = true

[memory]
enabled = false

