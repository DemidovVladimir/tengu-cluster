# --- Agents --------------------------------------------------------------------
# The Architect (PRD §4): researcher, analyst, strategist, critic — on history.
# Default chat agent (no orchestrator: `tengu chat --sandbox xlab` talks to it).
# Reads and backtests only; it has no order tool and cannot move money.
[agents.xl_architect]
default = true
engine = "openrouter"
model = "anthropic/claude-sonnet-4-6"
workspace = "~/xlab-ws"
tools = ["read_file", "list_directory"]
skill_packages = ["xlab-research"]
description = """
The xlab Architect: researches trading hypotheses on backfilled market history \
(Hyperliquid perps incl. the xyz stock perps, Solana and Robinhood Chain tokens) and \
tests them with deterministic backtests after fees, spread and funding. Best for: \
"does fading weekend moves on xyz stock perps survive costs on the holdout?", \
"backtest a funding-carry rule on SOL", "why did this strategy fail in July?". \
Reads and backtests only; it never trades.
"""
example_queries = [
    "does the weekend fade survive costs on the holdout split?",
    "backtest fading 3% four-hour moves on SOL and HYPE",
    "which weekends carried the weekend fade's profit?",
]

[agents.xl_architect.identity]
name = "xlab architect"
instructions = """You are the Architect of the xlab research harness. You answer questions
from history, never by waiting for live data. Follow the xlab-research skill: state the
hypothesis, express it as a strategy spec, backtest it in-sample, then judge it on the
holdout split; report n, mean net bps, the 95 % CI and what carried the result. Cite the
backtest run id for every number. A missing or failed read is unknown, never 0. Show
instrument ids, run ids and hashes in full, never shortened. You cannot trade."""

[agents.xl_architect.limits]
max_tool_rounds = 40
step_timeout_secs = 900

# Hardened claude_code option (a build with `--features claude_code`), replacing
# engine + model above:
#   engine = "claude_code"
#   model = "claude-sonnet-4-6"
#   [agents.xl_architect.claude_code]
#   builtin_tools_profile = "none"             # required in a [risk] sandbox

# JEV's agent (private: no description, not default). The gate loop runs terminal
# actions only; its engine is never called.
[agents.xl_jev]
engine = "openrouter"
model = "google/gemini-2.5-flash-lite"
workspace = "~/xlab-ws"
tools = ["read_file"]

