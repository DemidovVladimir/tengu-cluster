# Rule W exactly (docs/xmarket-feasibility-2026-09-30.md): Sun 18:00 NY fade the
# move since Fri 20:00, exit Mon 09:00 — every eligible name (the shadow ledger).
[backtest.strategies.weekend_fade]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 0

# The capped ledger's selection: the 4 largest |s| ≥ 50 bps.
[backtest.strategies.weekend_fade_top4]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 50
top_n = 4

# Placebo: the same window, following the move instead of fading it.
[backtest.strategies.weekend_follow]
kind = "weekend_window"
universe = "@xyz_stocks"
interval = "1h"
calendar = "us_equity"
direction = "follow"
min_abs_signal_bps = 0

# Overnight follow-through: the move from the 16:00 close to 20:00, held to
# 09:00 the next trading day (a generic cousin of rule E, without events).
[backtest.strategies.xyz_overnight_follow]
kind = "daily_window"
universe = "@xyz_stocks"
interval = "1h"
days = "trading"
calendar = "us_equity"
tz = "America/New_York"
anchor = "16:00"
entry = "20:00"
exit = "09:00"
direction = "follow"
min_abs_signal_bps = 100

# Funding dislocation on the stock perps: receive funding while |rate| is
# extreme, out when it normalises.
[backtest.strategies.xyz_funding_carry]
kind = "funding_carry"
universe = "@xyz_stocks"
interval = "1h"
min_apr_pct = 50
exit_apr_pct = 15
hold_hours = 48

# Market-first anomaly on crypto perps: fade a ≥ 3 % move in 4 h on ≥ 2× volume.
[backtest.strategies.crypto_move_fade]
kind = "move_trigger"
universe = "@crypto"
interval = "1h"
lookback_bars = 4
threshold_bps = 300
min_volume_ratio = 2.0
volume_baseline_bars = 168
direction = "fade"
hold_bars = 12
cooldown_bars = 12

[backtest.strategies.crypto_funding_carry]
kind = "funding_carry"
universe = "@crypto"
interval = "1h"
min_apr_pct = 30
exit_apr_pct = 10
hold_hours = 72

# Convergence: SOL vs ETH log spread, 1 week z-score (a pair names its legs:
# no universe).
[backtest.strategies.sol_eth_spread]
kind = "pair_spread"
legs = ["hyperliquid:SOL", "hyperliquid:ETH"]
interval = "1h"
lookback_bars = 168
entry_z = 2.0
exit_z = 0.5
max_hold_bars = 72

# --- JEV: the gate arm (PRD §37 / §38 baseline C) ------------------------------
# Replayed on history by `tengu backtest --gate xl_gate`: one decision per rule
# candidate, terminal actions only, no tools; decisions cached in
# ~/.tengu/state/xlab/backtests/decision-cache.db (a rerun is free + identical).
[decision_loops.xl_gate]
model = "~typesafe/jev-latest"
agent = "xl_jev"
goal = """Gate for trades a deterministic rule proposes on Hyperliquid perps (paper research, \
$100 book). The event carries the rule, the instrument, the trade side, the signal size in bps \
and features measured before the decision: recent returns, volatility, volume vs normal, \
trades in the last bar, funding (APR %), the estimated half-spread and the hour of the week. \
Take the trade only when it looks like the dislocation the rule bets on and is cheap to trade; \
skip it when the market is thin (few trades, wide spread), the move looks like news the price \
should keep, or volatility makes the edge noise. Ask the architect when the event needs \
research you cannot do from these numbers."""
act_at = 0.6
max_steps = 1
escalate = false
dry_run = true
history = 1

[decision_loops.xl_gate.actions.take]
description = "Take the proposed trade exactly as the rule specifies (side, size, exit)."

[decision_loops.xl_gate.actions.skip]
description = "Do not trade this candidate."

[decision_loops.xl_gate.actions.ask_architect]
description = "Unsure from the numbers: the move needs research (news, filings, related assets) first."

