# --- Backtests: the deterministic layer + the strategy library ----------------
# Specs = the Architect's level-2 capabilities (docs/xlab-2026-10-01.md § 5):
# data, never code. The Architect proposes new ones through the `backtest` tool.
[backtest]
notional_usd = 100               # research arm: every candidate at $100
bootstrap = 2000
seed = 7
gate = "xl_gate"

# Costs per side, longest id prefix wins (§ 6). xyz: the feasibility study's
# 3.8 bps round trip (0.9 fee growth mode + 1.0 half-spread); main-dex perps:
# tier-0 taker 4.5 bps + archive impact spread when imported; DEX tokens:
# pool fee + a bar-estimated spread (RH tokens cost 30–220 bps round trip).
[backtest.costs."hyperliquid:xyz:"]
taker_fee_bps = 0.9
half_spread = { model = "fixed", bps = 1.0 }

[backtest.costs."hyperliquid:"]
taker_fee_bps = 4.5
half_spread = { model = "ctx", fallback_bps = 1.0 }

[backtest.costs."solana:"]
taker_fee_bps = 5.0
half_spread = { model = "abdi_ranaldo", window_bars = 48, floor_bps = 2.0 }
funding = false

[backtest.costs."robinhood:"]
taker_fee_bps = 25.0
half_spread = { model = "abdi_ranaldo", window_bars = 48, floor_bps = 10.0 }
funding = false

[backtest.universes]
xyz_stocks = [                   # 75 xyz single stocks (= sandboxes/xmarket-weekend)
    "hyperliquid:xyz:AAOI", "hyperliquid:xyz:AAPL", "hyperliquid:xyz:AMAT", "hyperliquid:xyz:AMD",
