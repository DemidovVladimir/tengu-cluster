exclude = []                     # full ids neither ledger trades (a split / halt that weekend)
capped_top_n = 4                 # [risk] account: the 4 largest |s| …
min_abs_signal_bps = 50          # … of at least 50 bps
capped_notional_usd = 25         # each, through the [risk] gate
shadow_account = "xmarket-weekend-shadow"   # every eligible name, executable prices, no caps
shadow_initial_cash_usd = 10000
shadow_notional_usd = 100
expected_edge_bps = 23           # half the in-sample +46 bps; ≥ [risk] min_edge_bps
anchor_max_age_secs = 600        # ≥ [recorder] heartbeat_secs
entry_max_age_secs = 120         # ≥ the hl_ctx interval + jitter
entry_lateness_max_secs = 600    # no snapshot by entry + 10 min ⇒ missed_entry
max_slippage_bps = 100           # IOC bound of every fade order and shadow exit

# --- Risk + paper: the $100 budget (rules: src/config/risk.rs) ---------------
[risk]
account = "xmarket-weekend"
mode = "paper"
venues = ["hyperliquid"]
min_lifecycle = "paper_tradable"
instruments_allow = [            # = the universe (load rule: every name not excluded tradable)
    "hyperliquid:xyz:AAOI", "hyperliquid:xyz:AAPL", "hyperliquid:xyz:AMAT", "hyperliquid:xyz:AMD",
    "hyperliquid:xyz:AMZN", "hyperliquid:xyz:ARM", "hyperliquid:xyz:ASML", "hyperliquid:xyz:AVGO",
    "hyperliquid:xyz:BABA", "hyperliquid:xyz:BB", "hyperliquid:xyz:BE", "hyperliquid:xyz:BIRD",
    "hyperliquid:xyz:BMNR", "hyperliquid:xyz:BOT", "hyperliquid:xyz:BX", "hyperliquid:xyz:CBRS",
    "hyperliquid:xyz:COIN", "hyperliquid:xyz:COST", "hyperliquid:xyz:CRCL", "hyperliquid:xyz:CRWD",
    "hyperliquid:xyz:CRWV", "hyperliquid:xyz:CVX", "hyperliquid:xyz:CXMT", "hyperliquid:xyz:DELL",
    "hyperliquid:xyz:DKNG", "hyperliquid:xyz:EBAY", "hyperliquid:xyz:GEV", "hyperliquid:xyz:GIGADEV",
    "hyperliquid:xyz:GME", "hyperliquid:xyz:GOOGL", "hyperliquid:xyz:HIMS", "hyperliquid:xyz:HOOD",
    "hyperliquid:xyz:HYUNDAI", "hyperliquid:xyz:IBM", "hyperliquid:xyz:INTC", "hyperliquid:xyz:IREN",
    "hyperliquid:xyz:KIOXIA", "hyperliquid:xyz:LITE", "hyperliquid:xyz:LLY", "hyperliquid:xyz:META",
    "hyperliquid:xyz:MINIMAX", "hyperliquid:xyz:MRNA", "hyperliquid:xyz:MRVL", "hyperliquid:xyz:MSFT",
    "hyperliquid:xyz:MSTR", "hyperliquid:xyz:MU", "hyperliquid:xyz:NBIS", "hyperliquid:xyz:NET",
    "hyperliquid:xyz:NFLX", "hyperliquid:xyz:NOK", "hyperliquid:xyz:NOW", "hyperliquid:xyz:NVDA",
    "hyperliquid:xyz:ORCL", "hyperliquid:xyz:PLTR", "hyperliquid:xyz:PURRDAT", "hyperliquid:xyz:QCOM",
    "hyperliquid:xyz:QNT", "hyperliquid:xyz:RDDT", "hyperliquid:xyz:RIVN", "hyperliquid:xyz:RKLB",
    "hyperliquid:xyz:SHAZ", "hyperliquid:xyz:SHEIN", "hyperliquid:xyz:SKHX", "hyperliquid:xyz:SKHY",
    "hyperliquid:xyz:SMSN", "hyperliquid:xyz:SNDK", "hyperliquid:xyz:SOFTBANK", "hyperliquid:xyz:SPCX",
    "hyperliquid:xyz:TSLA", "hyperliquid:xyz:TSM", "hyperliquid:xyz:UNITREE", "hyperliquid:xyz:USAR",
    "hyperliquid:xyz:WDC", "hyperliquid:xyz:ZHIPU", "hyperliquid:xyz:ZM",
]
instruments_deny = []
max_order_notional_usd = 25      # = capped_notional_usd (HL minimum $10)
max_position_notional_usd = 50
max_asset_exposure_usd = 50
max_venue_exposure_usd = 110
max_gross_exposure_usd = 110     # 4 × $25 + headroom: marks move between fills
max_net_exposure_usd = 110       # fades often share a side
max_leverage = 1.2               # $100 gross on ~$99.99 equity after fees
daily_loss_limit_usd = 10
total_loss_limit_usd = 25
min_edge_bps = 10                # ≤ expected_edge_bps
max_slippage_bps = 30            # capped entries: book walk VWAP ≤ 30 bps from mid
min_depth_usd = 250
require_hedge_for = []           # never "overreaction": the fades have no hedge leg
max_data_age_ms = { book = 5000, ctx = 90000, reference = 60000, quote = 20000 }   # ctx ≥ hl_ctx 60 s + jitter
max_skew_ms = 5000
max_orders_per_min = 12          # 4 entries Sun 18:00, 4 exits Mon 09:00 + retries
max_open_orders = 4
kill_switch_file = "~/.tengu/state/xmarket-weekend/KILL"   # present = halted
allow_reduce_degraded = true

[risk.exits]                     # the deadline (Mon 09:00) closes; the rest are disaster stops
take_profit_bps = 2000
stop_loss_bps = 1000
max_hold_secs = 86400            # > the 15 h hold (entry 18:00 → 09:00 next trading day)

[paper]
initial_cash_usd = 100
latency_ms = 250
latency_jitter_ms = 100
fee_tier = 0
staking_discount_pct = 0
order_types = ["market", "ioc"]

# --- The one agent: a private tool owner (no description, not default) -----
# Exec tools run only on a private agent. The engine is never called by
# `tengu run` (feeds call tools directly); it only satisfies the schema.
[agents.xm_weekend]
engine = "openrouter"
model = "google/gemini-2.5-flash-lite"
workspace = "~/xmarket-weekend-ws"
tools = ["hl_ctx", "hl_book", "risk_status", "paper_positions", "xm_exits", "xm_weekend_fade"]

# --- Tool scopes (each explicit: no tool gets the fallback) -----------------
[default_scopes.sign_and_send_transaction]   # required with [risk], no wallets: Privy signing off

[default_scopes.sign_message]

[default_scopes.hl_ctx]
fs_roots = ["~/xmarket-weekend-ws"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.hl_book]
fs_roots = ["~/xmarket-weekend-ws"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.risk_status]
fs_roots = ["~/xmarket-weekend-ws"]

[default_scopes.paper_positions]
fs_roots = ["~/xmarket-weekend-ws"]

[default_scopes.xm_exits]
fs_roots = ["~/xmarket-weekend-ws"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.xm_weekend_fade]
fs_roots = ["~/xmarket-weekend-ws"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

# --- Request budget, recorder, runtime --------------------------------------
[rate_limits.hyperliquid]
per_minute = 1200                # HL: 1200 weight / min / IP; this sandbox peaks near 200

[recorder]
enabled = true
schemas = ["mkt_ctx/1", "hl_book/1", "mkt_instrument/1"]
keep_data = ["hl_book/1"]        # full books (levels); the others keep features
change_only = true
heartbeat_secs = 300             # ≤ anchor_max_age_secs
retention_days = 90              # covers the run + its analysis

[runtime]                        # the defaults, written out
shutdown_grace_secs = 20
max_decisions_in_flight = 4
heartbeat_secs = 5
heartbeat_stale_secs = 30

# --- Feeds (no LLM, no Jev: every feed is a tool call) ----------------------
[feeds.hl_ctx]                   # every xyz market: mkt_ctx/1 (prices) + mkt_instrument/1 (fills, closes)
kind = "tool"
agent = "xm_weekend"
tool = "hl_ctx"
args = { dex = "xyz" }
every_secs = 60
jitter_pct = 10
run_on_start = true
required = true

[feeds.hl_book]                  # the 75 books every 5 min; every 60 s around entry and exit
kind = "tool"
agent = "xm_weekend"
tool = "hl_book"
every_secs = 300
tz = "America/New_York"
windows = [
    { days = ["Sun"], from = "17:00", to = "19:00", every_secs = 60 },
    { days = ["Mon"], from = "08:30", to = "09:30", every_secs = 60 },
]
concurrency = 4                  # one sweep in a few seconds
run_on_start = true
required = true

[feeds.hl_book.each]
coin = [
    "xyz:AAOI", "xyz:AAPL", "xyz:AMAT", "xyz:AMD", "xyz:AMZN", "xyz:ARM",
    "xyz:ASML", "xyz:AVGO", "xyz:BABA", "xyz:BB", "xyz:BE", "xyz:BIRD",
    "xyz:BMNR", "xyz:BOT", "xyz:BX", "xyz:CBRS", "xyz:COIN", "xyz:COST",
    "xyz:CRCL", "xyz:CRWD", "xyz:CRWV", "xyz:CVX", "xyz:CXMT", "xyz:DELL",
    "xyz:DKNG", "xyz:EBAY", "xyz:GEV", "xyz:GIGADEV", "xyz:GME", "xyz:GOOGL",
    "xyz:HIMS", "xyz:HOOD", "xyz:HYUNDAI", "xyz:IBM", "xyz:INTC", "xyz:IREN",
    "xyz:KIOXIA", "xyz:LITE", "xyz:LLY", "xyz:META", "xyz:MINIMAX", "xyz:MRNA",
    "xyz:MRVL", "xyz:MSFT", "xyz:MSTR", "xyz:MU", "xyz:NBIS", "xyz:NET",
    "xyz:NFLX", "xyz:NOK", "xyz:NOW", "xyz:NVDA", "xyz:ORCL", "xyz:PLTR",
    "xyz:PURRDAT", "xyz:QCOM", "xyz:QNT", "xyz:RDDT", "xyz:RIVN", "xyz:RKLB",
    "xyz:SHAZ", "xyz:SHEIN", "xyz:SKHX", "xyz:SKHY", "xyz:SMSN", "xyz:SNDK",
    "xyz:SOFTBANK", "xyz:SPCX", "xyz:TSLA", "xyz:TSM", "xyz:UNITREE", "xyz:USAR",
    "xyz:WDC", "xyz:ZHIPU", "xyz:ZM",
]

[feeds.xm_weekend_fade]          # rule W: one idempotent step of the window per call
kind = "tool"
agent = "xm_weekend"
tool = "xm_weekend_fade"
every_secs = 60
run_on_start = true
required = true

[feeds.xm_exits]                 # closes the capped fades at the deadline
kind = "tool"
agent = "xm_weekend"
tool = "xm_exits"
args = { max_slippage_bps = 100 }   # = the shadow exits' bound (fade max_slippage_bps)
every_secs = 15
run_on_start = true
required = true

[feeds.risk_day]                 # rolls the daily-loss base (day-start equity)
kind = "tool"
agent = "xm_weekend"
tool = "risk_status"
tz = "UTC"
at = ["daily 00:01"]
run_on_start = true
required = true
stale_after_secs = 90000         # 25 h
