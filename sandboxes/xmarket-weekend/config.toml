# Tengu Cluster — "xmarket-weekend" sandbox (2026-10-01)
# The weekend investigation run (xmarket W1, tracker `x-weekend-sandbox`): rule W,
# the weekend fade, paper-traded on the 75 Hyperliquid xyz single-stock perps,
# with their contexts and order books recorded around it. Floor profile: no LLM,
# no X, no Jev — `tengu run` feeds call tools directly. Paper only: no key, no
# order leaves this Mac. Build plan § The weekend investigation sandbox; rule W:
# docs/xmarket-risk-paper-2026-09-30.md § Weekend fade; runtime:
# docs/runtime-2026-09-30.md § Weekend run.
#
# RUNBOOK — commands run from the repo root (`--sandbox` resolves
# sandboxes/<name>/ from the cwd; the repo-root .env sets TENGU_HOME=~/.tengu). Each tengu
# command asks for the vault password at a terminal: Enter skips it (nothing
# here needs a secret). Never start `tengu run` with `&`: the prompt stops a
# background job — run it in the foreground of a tmux pane.
#   build  CARGO_TARGET_DIR=$HOME/.cache/tengu-xm.noindex/main CARGO_BUILD_JOBS=2 nice -n 10 cargo build --release
#          T=$HOME/.cache/tengu-xm.noindex/main/release/tengu        (default features suffice)
#   start  tmux new -s xmw      (survives a closed terminal; detach Ctrl-b d, back: tmux attach -t xmw)
#          T=$HOME/.cache/tengu-xm.noindex/main/release/tengu; cd ~/development/tengu-cluster
#          caffeinate -i -s nice -n 10 "$T" run --sandbox xmarket-weekend
#          caffeinate holds the Mac awake (on power, lid open, online) exactly while the run lives,
#          a restart in the pane included — no separate `caffeinate -w <pid>`
#          logs: the pane + ~/.tengu/logs/tengu.log; a second start exits 1 (lease runtime:xmarket-weekend)
#   check  "$T" doctor --sandbox xmarket-weekend --live      exit 0 = heartbeat fresh, every required feed live —
#          not proof of fills: a fade row other than `error` counts as live even when every fade failed
#          "$T" risk status --sandbox xmarket-weekend        capped ledger: equity, positions, halts
#          "$T" history range --sandbox xmarket-weekend mkt_ctx/1:hyperliquid:xyz:TSLA --from 2026-10-02T19:55:00-04:00 --to 2026-10-02T20:05:00-04:00
#          "$T" tool call --sandbox xmarket-weekend --agent xm_weekend --tool xm_weekend_fade --args '{}'
#              → xm_weekend/1:2026-10-02, phase waiting (next_entry_s) → entered → closing → closed (P&L)
#          "$T" tool call --sandbox xmarket-weekend --agent xm_weekend --tool paper_positions --args '{"account":"xmarket-weekend-shadow"}'
#   entry  Sun 2026-10-04 18:11 New York: the xm_weekend_fade tool call above (phase entered,
#          n_capped_filled / n_shadow_filled, every fade not filled named in its errors) or risk status.
#          A capped pick whose book fails the gate (30 bps slippage, $250 depth) is denied and not
#          replaced: the risk policy, kept — the shadow ledger measures every name at the 100 bps IOC
#          bound. Until 18:10 a fill rejection that may pass later (no mid, no liquidity, a stale book,
#          missing data) is placed again as <id>:2, <id>:3 …; an unknown OI-cap state is denied and
#          judged again (rule W: docs/xmarket-risk-paper-2026-09-30.md § Weekend fade)
#   stop   Ctrl-C in the pane (or kill -TERM <pid>): drains ≤ 20 s, exit 0, lease released,
#          ~/.tengu/state/xmarket-weekend/run-xmarket-weekend.json state "stopped"
#   P&L    sqlite3 ~/xmarket-weekend-ws/.tengu/observations.db "select body from observations where key = 'xm_weekend/1:2026-10-02'" | jq .features
#          (once closed, the tool call above already shows the next window)
#   timeline  America/New_York        UTC          Mac (Europe/Berlin)  Almaty (UTC+5)
#     start   ≤ Fri 2026-10-02 19:30  ≤ Fri 23:30  ≤ Sat 01:30         ≤ Sat 04:30   recording before the anchor, or nothing enters
#     anchor    Fri 2026-10-02 20:00    Sat 00:00    Sat 02:00           Sat 05:00   mkt_ctx/1 recorded (the anchor price)
#     entry     Sun 2026-10-04 18:00    Sun 22:00    Mon 00:00           Mon 03:00   snapshot, 4 capped + every shadow fade
#     exit      Mon 2026-10-05 09:00    Mon 13:00    Mon 15:00           Mon 18:00   xm_exits closes capped, the fade tool shadow
#     stop      Mon 2026-10-05 10:00    Mon 14:00    Mon 16:00           Mon 19:00   once the fade row says closed (else keep running)
# State: ~/.tengu/state/xmarket-weekend/ (ledger.db, runtime.db, history/, KILL = halt);
# workspace ~/xmarket-weekend-ws (only .tengu/observations.db).

runtime_profile = "auto"

# Open: latency-sensitive book reads. Tool ceiling = the HL host; the
# placeholder engine's API traffic is not under this ceiling (egress.rs: LLM
# API = proxy only), so nothing else is listed.
[egress]
network = "open"
allow_hosts = ["api.hyperliquid.xyz"]
https_only = true

[memory]
enabled = false          # no LLM, no embeddings

# --- xmarket: state dir, the weekend clock, rule W ---------------------------
[xmarket]
state = "xmarket-weekend"

# NYSE (config.example.toml / tests/fixtures/xmarket/calendars.toml).
[xmarket.calendars.us_equity]
kind = "exchange"
tz = "America/New_York"
core = ["09:30", "16:00"]
pre = "04:00"
post = "20:00"
overnight = true
early_close = "13:00"
early_post = "17:00"
holidays = [
    "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
    "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
    "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
    "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
    "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
    "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
]
early_closes = ["2026-11-27", "2026-12-24", "2027-11-26", "2028-07-03", "2028-11-24"]

