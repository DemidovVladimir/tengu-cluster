# Tengu Cluster — "xmarket" sandbox, stage M0 (2026-10-01)
# The xmarket paper desk (tracker `ops-sandbox-config`): this file is the
# sandbox's only config — one owner, sections staged per milestone. It holds
# what wave W1 built and loads today; STAGED lists what later items add.
# Paper only: no key, no order leaves the process; the $100 budget is [risk].
# Rule W (the weekend fade) lives in sandboxes/xmarket-weekend, never here —
# both may run at once (own state dir, workspace, lease, ledger).
# Runtime: docs/runtime-2026-09-30.md § xmarket sandbox.
#
# RUNBOOK — from the repo root (`--sandbox` resolves sandboxes/<name>/ from the
# cwd; the repo-root .env sets TENGU_HOME=~/.tengu and OPENROUTER_API_KEY). At a
# terminal each tengu command asks for the vault password: Enter skips it
# (stdin /dev/null too). Never start `tengu run` with `&` at a terminal: the
# prompt stops a background job — run it in a tmux pane.
#   build   CARGO_TARGET_DIR=$HOME/.cache/tengu-xm.noindex/main CARGO_BUILD_JOBS=2 nice -n 10 cargo build --release
#           T=$HOME/.cache/tengu-xm.noindex/main/release/tengu        (default features suffice)
#   start   tmux new -s xm, then: nice -n 10 "$T" run --sandbox xmarket
#           logs: the pane + ~/.tengu/logs/tengu.log; a second start exits 1 (lease runtime:xmarket)
#   check   "$T" doctor --sandbox xmarket --live      exit 0 = heartbeat fresh, every required feed live
#           "$T" doctor --sandbox xmarket --engines   one small OpenRouter turn per agent (costs tokens)
#           "$T" risk status --sandbox xmarket        cash, positions + exit deadlines, halts, last verdicts
#           "$T" tool call --sandbox xmarket --agent xm_executor --tool risk_status   equity at mark, loss headroom
#   chat    "$T" chat --sandbox xmarket               planner xm → xm_architect (read-only research + the book)
#   halt    touch ~/.tengu/state/xmarket/KILL   or   "$T" risk halt --sandbox xmarket (TTY)
#   resume  remove KILL, then "$T" risk resume --sandbox xmarket (TTY; type the account name)
#   stop    Ctrl-C in the pane (or kill -TERM <pid>): drains ≤ 20 s, exit 0, lease released,
#           ~/.tengu/state/xmarket/run-xmarket.json state "stopped"
# Entries: none yet — the gate needs an xm_compare/1 opportunity row (risk-calc-tools) and the
# M0 loop places them (jev-xmarket-loops-toml). Recording, exits and the day roll run now.
# State: ~/.tengu/state/xmarket/ (ledger.db, runtime.db, run-xmarket.json, history/, KILL);
# research/ in it is operator data tengu never touches. Workspace ~/xmarket-workspace
# (only .tengu/observations.db).
#
# STAGED — what later items add (tracker § 5 ids):
#   M   items                                          adds
#   M0  info-fetch, info-parsers, info-edgar           [feeds.edgar_8k] kind = "poll" (Tesla CIK 0001318605),
#                                                      [rate_limits.sec-gov], www.sec.gov in allow_hosts + its scope
#   M0  risk-calc-tools                                xm_cost, xm_compare on xm_executor (the min_edge_bps row)
#   M0  jev-event-key, jev-event-templating,           [decision_loops.xm_main] on xm_executor: inspect_book →
#       jev-xmarket-loops-toml                         compare → paper_enter, escalate = false; edgar_8k → target
#   M0  ops-openrouter-budget-key, ops-deploy-compose  the $40 / day key; Docker on the VPS (--features webhooks)
#   M1  kg-catalog-store, kg-lifecycle, kg-sync-*,     [xmarket] catalog + lifecycle knobs, sync feeds, recorder
#       kg-sync-schedule                               += kg rows; [risk] min_lifecycle enforced
#   M1  hl-skill, rh-skill, rh-evm-rpc                 xm_architect skills (+ http_request on HL / RH hosts), [evm.chains]
#   M2  rh-quote, rh-dex-quote-v3/v4, rh-lighter,      RH, CEX and HL read tools + scopes + hosts; hl_ctx for
#       rh-halts, hl-cex-ctx-tool, hl-ws-stream        default / para / mkts / io (§ 7 #6)
#   M2  rt-series-detectors, rt-bus-dispatch           market_anomaly stub loop (dry_run = true; ignore + hl_ctx / hl_book)
#   M3b hl-account-setup, risk-evm-signer,             HL API-wallet key file (outside every fs root), hl_order on
#       risk-hl-exchange, kg-live-approval             a private agent, live caps ≤ $100
#   M4  info-config, info-store, info-sources-mvp,     news feeds + [news.*], X ingest, [webhooks], [spend]
#       info-x-ingest, info-webhook-sink, ops-cost-guard
#   M5  info-jev-gate, jev-architect-config,           info_triage + full market_anomaly (escalation on);
#       jev-research-submit-tool, jev-architect-escalator  xm_architect's final model, skills, xm_submit_research
#   M5  ops-alerts-telegram                            [telegram] alerts
#   M6  risk-opportunity-metrics, x-risk-relation-gate opportunity + position_manager loops (paper_* exec tools only)
#
# SECRETS / ENV — names only (vault `tengu secret set <NAME>` or the repo .env):
#   OPENROUTER_API_KEY     the dedicated xmarket key, $40 / day limit (ops-openrouter-budget-key):
#                          xm + xm_architect now, Jev and extraction later
#   TENGU_MASTER_PASSWORD  unlocks the vault without a prompt (daemon, Docker)
#   TENGU_HOME             ~/.tengu (repo .env) · HL_API_URL: optional testnet override, unset = mainnet
#   later                  SEC_USER_AGENT (M0 EDGAR) · TENGU_XM_WEBHOOK_SECRET, X_BEARER_TOKEN (M4) ·
#                          TELEGRAM_BOT_TOKEN, XM_ALERT_CHAT_ID (M5) · vendor keys: ALPACA_*, LIFI_API_KEY,
#                          OPENFIGI_API_KEY, COINGECKO_DEMO_API_KEY, ROBINHOOD_RPC_URL (M1–M2)
#   No signer key: paper only (M3b adds the HL API-wallet key file).

runtime_profile = "auto"

# --- Network -----------------------------------------------------------------
# Open (convention 17), a one-line switch to "tor" once hl-tor-probe (M1) has
# checked every host. The ceiling covers tool traffic (http_request, HL info,
# Solana): exactly the HL host the M0 tools use. The LLM API (OpenRouter: the
# xm / xm_architect engines, later Jev) is outside it (egress.rs: proxy only).
[egress]
network = "open"
allow_hosts = ["api.hyperliquid.xyz"]
https_only = true

# --- Memory + planner (default build) ----------------------------------------
# No vector memory: the planner keeps the session's last messages in-process.
# Open Brain needs a `--features postgres_memory` build + TENGU_MEMORY_DATABASE_URL;
# then: enabled = true, within_session_output_top_k = 3.
[memory]
enabled = false

[orchestrator]
agent = "xm"
engine = "rag"
max_attempts_per_step = 2
max_replans = 1

