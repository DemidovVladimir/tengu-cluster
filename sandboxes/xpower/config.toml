# Tengu Cluster — "xpower" sandbox (2026-10-19, research)
# Can a crypto-only trader (DEX, Solana first; no CEX, no BNB) trade electricity,
# and is there an edge in it? The question from a "Headliners" episode on EU
# power trading (EPEX SPOT / Nord Pool intraday, prop traders) where a speaker
# said it can be done on Hyperliquid or Robinhood. History first
# (docs/xlab-2026-10-01.md): public power data + Hyperliquid proxies, no waiting.
# Subscriptions only (Claude plan + ChatGPT plan), no OpenRouter, no spend.
#
#   venue_scout  (Claude Code, research)     where crypto can buy power exposure: DEX perps, HIP-3,
#                                            prediction markets, tokenised energy — evidence table
#   news_scout   (Claude Code, research)     timestamped energy news (UTC) for a window — events JSON
#   quant        (Claude Code, editor_shell) sqlite3 / jq over the data the driver fetched (power.db,
#                                            market.db copy): DA vs intraday, forecast error, outages
#   architect    (Claude Code, read_only)    strategy specs on the tradable proxies → `backtest`
#   critic       (Codex, live web search)    challenges every load-bearing number, writes the verdict
#   xp_recorder  (private) feeds: hl_ctx / hl_book of the proxies (HIP-3 books are in no archive)
#   xp_fetch     (private) http_request for the driver's data pulls (tengu tool call)
#
# Tradable proxies on Hyperliquid (checked live 2026-10-19 21:53 CEST): no power
# perp anywhere on HL; xyz:TTF (Dutch gas, sets most EU power prices) is listed
# with an empty book and no candles; xyz:NATGAS (Henry Hub) trades ~$115M/week at
# a 1.5 bps spread; para:VST (Vistra, ERCOT generator) ~$2.8M/week at ~15 bps.
#
# Run from the repo root (build with --features claude_code; `claude` and `codex`
# logged in). The driver, the data and every result live outside the repo:
#   export TENGU_HOME=~/tengu-lab/home
#   ~/tengu-lab/xpower/driver.sh           # data → lanes → overnight journal → verdict
#   tengu run --sandbox xpower             # the recorder (feeds below), beside it
#   tengu a2a serve --sandbox xpower       # the agents, called by the driver
# Results: ~/tengu-lab/xpower/out/*.md, journal/, progress.log; state (market.db,
# backtests/, recorder day files): ~/tengu-lab/home/state/xpower/.

runtime_profile = "auto"

# Open: WebSearch and Codex web search run at the providers; http_request reads
# pages and public APIs directly (every transport through egress.rs, so
# switchable to Tor; the Claude CLI then gets the proxy env).
[egress]
network = "open"

[memory]
enabled = false

# State dir ~/tengu-lab/home/state/xpower: market.db, backtests/, history/.
[xmarket]
state = "xpower"

# NYSE holidays (= us_equity in sandboxes/xlab): the closed-market gap specs use it as
# the CME holiday proxy (CME energy closes on the same US holidays; offsets set the hours).
[xmarket.calendars.us_equity]
kind = "exchange"
tz = "America/New_York"
core = ["09:30", "16:00"]
pre = "04:00"
post = "20:00"
overnight = true
early_close = "13:00"
early_post = "17:00"
holidays = [
    "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
    "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
    "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
    "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
    "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
    "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
]
early_closes = ["2026-11-27", "2026-12-24", "2027-11-26", "2028-07-03", "2028-11-24"]

[rate_limits.hyperliquid]
per_minute = 600                  # HL allows 1200 weight / min / IP; leave half for backfills

# --- Recorder: every typed row the feeds read, full payloads -----------------
[recorder]
enabled = true
schemas = ["*"]
keep_data = ["*"]
change_only = true
heartbeat_secs = 300
retention_days = 30

[runtime]
shutdown_grace_secs = 20
max_decisions_in_flight = 1
heartbeat_secs = 5
heartbeat_stale_secs = 30

# --- Feeds (no LLM): contexts of the energy dexes, books of the proxies -------
[feeds.hl_ctx_xyz]                # NATGAS, CL, BRENTOIL, HO, XLE, GEV, BE, URNM, TTF (listed, not trading)
kind = "tool"
agent = "xp_recorder"
tool = "hl_ctx"
args = { dex = "xyz" }
every_secs = 60
tz = "America/New_York"         # the CME daily break 17:00-18:00 NY (Sun: the weekly reopen)
windows = [{ days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri"], from = "16:45", to = "18:30", every_secs = 15 }]
jitter_pct = 10
run_on_start = true

[feeds.hl_ctx_para]               # para:VST
kind = "tool"
agent = "xp_recorder"
tool = "hl_ctx"
args = { dex = "para" }
every_secs = 60
jitter_pct = 10
run_on_start = true

[feeds.hl_book]
kind = "tool"
agent = "xp_recorder"
tool = "hl_book"
every_secs = 120
tz = "America/New_York"
windows = [{ days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri"], from = "16:45", to = "18:30", every_secs = 30 }]
jitter_pct = 10
concurrency = 3
run_on_start = true

[feeds.hl_book.each]
coin = [
    "xyz:NATGAS", "xyz:TTF", "para:VST", "xyz:CL", "xyz:BRENTOIL", "xyz:HO",
    "xyz:XLE", "xyz:GEV", "xyz:BE", "xyz:URNM",
]

# --- Backtests: the deterministic layer on the tradable proxies --------------
# Pre-registered 2026-10-19 before any backtest or price read of these names
# (the only prior look: the live spreads and 7-day volumes in the header).
[backtest]
notional_usd = 100
bootstrap = 2000
seed = 7

# Costs per side, longest id prefix wins. Fees: HIP-3 taker unknown per dex
# (growth mode or not) — 2.0 bps on xyz and 9.0 bps on para, both on the high
# side; half-spreads = half the live spread at 21:53 CEST, rounded up.
[backtest.costs."hyperliquid:xyz:"]
taker_fee_bps = 2.0
half_spread = { model = "fixed", bps = 2.0 }

[backtest.costs."hyperliquid:xyz:NATGAS"]
taker_fee_bps = 2.0
half_spread = { model = "fixed", bps = 1.0 }

[backtest.costs."hyperliquid:xyz:CL"]
taker_fee_bps = 2.0
half_spread = { model = "fixed", bps = 0.5 }

[backtest.costs."hyperliquid:xyz:BRENTOIL"]
taker_fee_bps = 2.0
half_spread = { model = "fixed", bps = 0.5 }

[backtest.costs."hyperliquid:xyz:HO"]
taker_fee_bps = 2.0
half_spread = { model = "fixed", bps = 5.5 }

[backtest.costs."hyperliquid:para:"]
taker_fee_bps = 9.0
half_spread = { model = "fixed", bps = 7.5 }

[backtest.universes]
power_proxies = [
    "hyperliquid:xyz:NATGAS", "hyperliquid:para:VST", "hyperliquid:xyz:CL",
    "hyperliquid:xyz:BRENTOIL", "hyperliquid:xyz:HO", "hyperliquid:xyz:XLE",
    "hyperliquid:xyz:GEV", "hyperliquid:xyz:BE", "hyperliquid:xyz:URNM",
]
gas = ["hyperliquid:xyz:NATGAS"]
power_equity = ["hyperliquid:para:VST", "hyperliquid:xyz:GEV", "hyperliquid:xyz:BE"]
cme_energy = ["hyperliquid:xyz:NATGAS", "hyperliquid:xyz:CL", "hyperliquid:xyz:HO"]   # NYMEX hours: Sun 18:00 - Fri 17:00 NY, break 17-18
ng_cl = ["hyperliquid:xyz:NATGAS", "hyperliquid:xyz:CL"]   # the two that really trade through the break (lane 06b)

# The EIA weekly gas storage report (Thursday 10:30 New York: 15:30 UTC before
# the 2026-03-08 DST change, 14:30 UTC after) — the one scheduled US gas event.
