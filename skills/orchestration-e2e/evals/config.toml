# End-to-end eval config for the harness-owned orchestration system.
#
# Consumed by `tengu eval orchestration-e2e`.
# Runner: src/adapters/eval_builder.rs (discover_skills walks skills/<name>/evals/).
#
# Purpose: exercise the orchestrator agent (planner → DAG executor → workers)
# through a 5-row prompt suite covering direct response, sequential DAG,
# parallel fan-out with synthesizer, failure/replan, and the "skip orchestration
# for trivial input" fast path.

runtime_profile = "cloud"

[memory]
enabled = true

# Presence of this block activates harness-owned orchestration (design §5.1).
# The referenced agent below must exist in [agents.*].
[orchestrator]
agent = "orchestrator"
max_attempts_per_step = 3
max_replans = 2

# ---------------------------------------------------------------------------
# Orchestrator agent — planner only. Gets memory_search; no other tools.
# ---------------------------------------------------------------------------
[agents.orchestrator]
default = false
engine = "openrouter"
model = "anthropic/claude-haiku-4-5"
workspace = "{TMP_WORKSPACE}"
workspace_tools = ["memory_search"]

[agents.orchestrator.identity]
instructions = """
You are an ORCHESTRATOR. You do not answer the user's question directly.
You decompose their request into a plan of work for specialist agents.

You MUST emit exactly one JSON object and nothing else:
  - no prose before or after
  - no markdown code fences
  - no explanations, apologies, or commentary
  - no tool calls (you have no tools — any attempt is an error)

The JSON object is one of two shapes:

  {"kind": "direct", "response": "..."}

    Use this ONLY when the request is trivial social chat, a simple
    greeting, or a single-fact arithmetic/definition the orchestrator can
    answer in one sentence. When in doubt, prefer a plan over direct.

  {"kind": "plan", "steps": [
    {"id": "s1", "agent": "<agent_name>", "goal": "<focused single-sentence goal>", "depends_on": []},
    ...
  ]}

    Use this for any request that involves research, fetching data,
    multi-step reasoning, writing, or synthesis.

Rules for plans:
  1. Every step has a unique `id` string.
  2. `agent` must name one of the agents in the roster below.
  3. `depends_on` lists ids that must complete first. Steps with
     depends_on=[] run in parallel.
  4. Exactly ONE step has no dependents (the leaf). Its output is the
     final response. If you fan out, include a final synthesizer step
     whose depends_on is all the parallel branches.
  5. Goals must be single-sentence and focused — the worker sees only
     this goal plus upstream step outputs.

Available agents:

{{ roster }}

Emit the JSON object and stop. Do not add anything after the closing brace.
"""

[agents.orchestrator.limits]
max_tool_rounds = 5
stream_event_timeout_secs = 60

# ---------------------------------------------------------------------------
# Worker: researcher — used for info-gathering steps.
# ---------------------------------------------------------------------------
[agents.researcher]
default = true
engine = "openrouter"
model = "anthropic/claude-sonnet-4-6"
workspace = "{TMP_WORKSPACE}"
workspace_tools = ["http_request", "memory_search", "memory_ingest"]

[agents.researcher.identity]
instructions = "You are a focused researcher. Given a single goal, gather and return concise findings."

[agents.researcher.limits]
max_tool_rounds = 8
stream_event_timeout_secs = 60

# ---------------------------------------------------------------------------
# Worker: writer — drafts prose (synthesizer role in fan-out plans).
# ---------------------------------------------------------------------------
[agents.writer]
engine = "openrouter"
model = "anthropic/claude-sonnet-4-6"
workspace = "{TMP_WORKSPACE}"
workspace_tools = ["memory_search"]

[agents.writer.identity]
instructions = "You draft polished responses synthesizing inputs handed to you. Be concise."

[agents.writer.limits]
max_tool_rounds = 5
stream_event_timeout_secs = 60
