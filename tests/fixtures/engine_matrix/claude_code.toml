# Engine-matrix fixture sandbox (x-engine-matrix-smoke): the Claude CLI on the
# subscription, hardened (built-in tools off — required by [risk]; the engine
# always passes --strict-mcp-config), tools through `tengu mcp-bridge`.
# tests/engine_matrix.rs runs `tengu run-agent` on it once per tool set (build
# with --features claude_code); the doctor's smoke turn:
#   tengu -c tests/fixtures/engine_matrix/claude_code.toml doctor --engines
# The test sets TENGU_MATRIX_WORKSPACE (a fresh temp dir holding the token
# file), TENGU_HOME (fresh: ledger.db) and a registered secret
# (TENGU_SECRETS_LOADED) the bridge must redact.
#
# The xm set holds exec tools (paper_order, paper_close, xm_exits, xm_weekend_fade): only a private
# agent may hold them, and run-agent runs routable ones only, so it runs on
# the private `xm_*` agent through `tengu tool turn -c <this file> --agent
# xm_<name> --goal ...` (one in-process turn, the `@<agent>` chat path).
#
# Everything above [agents.*] is identical in the three fixtures
# (`fixtures_load_and_agree` checks it).

[egress]
network = "open"

[memory]
enabled = false

# `risk_status`: a new paper account per leg, `ledger.db` under
# <TENGU_HOME>/state/engine-matrix/. Its equity = initial_cash_usd = 86.42,
# a number the model can only learn from the tool.
[xmarket]
state = "engine-matrix"

# `xm_weekend_fade` (rule W on xyz:TSLA): NYSE as the weekend clock (the
# tests/fixtures/xmarket/calendars.toml row); outside Sun 18:00 → Mon 09:00
# New York the step reports waiting. It opens the [risk] account and the
# shadow account `matrix-shadow` on every call.
[xmarket.calendars.us_equity]
kind = "exchange"
tz = "America/New_York"
core = ["09:30", "16:00"]
pre = "04:00"
post = "20:00"
overnight = true
early_close = "13:00"
early_post = "17:00"
holidays = [
  "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
  "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
  "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
  "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
  "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
  "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
]
early_closes = ["2026-11-27", "2026-12-24", "2027-11-26", "2028-07-03", "2028-11-24"]

[xmarket.weekend_fade]
calendar = "us_equity"
universe = ["hyperliquid:xyz:TSLA"]
exclude = []
capped_top_n = 1
min_abs_signal_bps = 50
capped_notional_usd = 15
shadow_account = "matrix-shadow"
shadow_initial_cash_usd = 1000
shadow_notional_usd = 15
expected_edge_bps = 23
anchor_max_age_secs = 600
entry_max_age_secs = 120
entry_lateness_max_secs = 600
max_slippage_bps = 100

# The weekend fade's anchor price comes from the recorder's history.
[recorder]
enabled = true
schemas = ["mkt_ctx/1"]

[risk]
account = "matrix"
mode = "paper"
venues = ["hyperliquid"]
min_lifecycle = "paper_tradable"
instruments_allow = ["hyperliquid:xyz:TSLA"]
instruments_deny = []
max_order_notional_usd = 25
max_position_notional_usd = 50
max_asset_exposure_usd = 50
max_venue_exposure_usd = 100
max_gross_exposure_usd = 100
max_net_exposure_usd = 100
max_leverage = 1
daily_loss_limit_usd = 10
total_loss_limit_usd = 25
min_edge_bps = 10
max_slippage_bps = 30
min_depth_usd = 250
require_hedge_for = ["convergence"]
max_skew_ms = 5000
max_orders_per_min = 6
max_open_orders = 4
kill_switch_file = "/nonexistent/tengu-engine-matrix-kill/KILL"   # outside every fs root (hardened sandbox)
allow_reduce_degraded = true

[risk.max_data_age_ms]
book = 5000
ctx = 20000
reference = 60000
quote = 20000

# `xm_exits` closes the position the second paper_order opens with an
# exit_at_ms in the past (reason `deadline`); these rules never fire first.
[risk.exits]
take_profit_bps = 200
stop_loss_bps = 100
max_hold_secs = 86400

[paper]
initial_cash_usd = 86.42
latency_ms = 250
latency_jitter_ms = 100
fee_tier = 0
staking_discount_pct = 0
order_types = ["market", "ioc"]

# The xlab set's `backtest`: xyz costs, a one-name universe and rule W on it
# (`matrix_fade`: one trade over the seeded weekend); the goal's inline spec
# needs nothing more. Run dirs: <TENGU_HOME>/state/engine-matrix/backtests/.
[backtest]
bootstrap = 500

[backtest.costs."hyperliquid:xyz:"]
taker_fee_bps = 0.9
half_spread = { model = "fixed", bps = 1.0 }

[backtest.universes]
matrix = ["hyperliquid:xyz:TSLA"]

[backtest.strategies.matrix_fade]
kind = "weekend_window"
universe = "@matrix"
interval = "1h"
calendar = "us_equity"
direction = "fade"

# The xlab_rank set's `strategy_ranking`: the two move triggers of the test
# contract rank.test.v1 (tests/fixtures/strategy_ranking/lineage). A contract
# names its sandbox, so the leg runs a copy of this file at
# <tmp>/sandboxes/rank-test/config.toml + [strategy_ranking] (the test adds it).
[backtest.strategies.rank_fade]
kind = "move_trigger"
universe = "@matrix"
interval = "1h"
lookback_bars = 1
threshold_bps = 25
direction = "fade"
hold_bars = 3

[backtest.strategies.rank_follow]
kind = "move_trigger"
universe = "@matrix"
interval = "1h"
lookback_bars = 1
threshold_bps = 25
direction = "follow"
hold_bars = 3

# The sources set: `source_evidence` reads <TENGU_HOME>/state/engine-matrix/
# sources.db, seeded per leg by `tengu sources import` of the captured TED
# pair tests/fixtures/ted/search_change_notice.json (no network). The row is
# enabled with synthetic reviewed terms (an import passes the fetch gate);
# nothing fetches — the tool cannot.
[sources]
state = "engine-matrix"

[sources.registry.ted_search]
kind = "ted_search"
class = "law_regulator"
trust = "primary"
revision = "immutable"
enabled = true
hosts = ["api.ted.europa.eu"]
auth = "none"
rate_limit = "ted"
store_raw = true
jurisdiction = "EU"
language = "en"
query = "publication-date >= {from} AND publication-date <= {to}"
license = "synthetic engine-matrix terms"
terms_url = "https://example.org/terms"
terms_sha256 = "6e81b3dc57dee4be066314f20ab0be61c23469c5ad56743239ee1bd399d8899a"
terms_reviewed_at = "2026-10-08"
raw_retention_days = 90
record_retention_days = 0

[rate_limits.ted]
per_minute = 60
burst = 2

# [risk] turns Privy signing off: both signing tools need an explicit scope
# without wallets (src/config/risk.rs).
[default_scopes.sign_and_send_transaction]

[default_scopes.sign_message]

# Configured scopes that do NOT cover the workspace: every tool works only
# through the workspace grant a run-agent step adds to each configured scope
# (in the bridge too, for Claude Code) — the matrix proves that grant.
[default_scopes.list_directory]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

[default_scopes.read_file]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

[default_scopes.write_file]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

[default_scopes.hl_ctx]
fs_roots = ["/nonexistent/tengu-engine-matrix"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.hl_book]
fs_roots = ["/nonexistent/tengu-engine-matrix"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

# The xlab set: `market_history` reads <TENGU_HOME>/state/engine-matrix/
# market.db (seeded per leg by `tengu history import-json`, no network); a
# `fetch` would reach the history hosts only.
[default_scopes.market_history]
fs_roots = ["/nonexistent/tengu-engine-matrix"]
net_hosts = ["api.hyperliquid.xyz", "api.geckoterminal.com"]
env_reads = ["HL_API_URL", "GECKO_API_URL"]

# `backtest` reads the same market.db and writes a run dir in the state dir:
# no network, no env.
[default_scopes.backtest]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

# `strategy_ranking` runs the contract's backtests on the same market.db and
# writes <state dir>/strategy-rankings/: no network, no env.
[default_scopes.strategy_ranking]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

# `source_evidence` writes only its observation row (the workspace store);
# sources.db sits in the state dir. No network, no env.
[default_scopes.source_evidence]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

# The soe set: the `[sources] state` dir above is also the SOE state root
# <TENGU_HOME>/state/engine-matrix/ (seeded per leg from
# tests/fixtures/soe/state/: a week open in PROPOSE, a replay open in
# CHALLENGE). The three tools read and write only there — the state dir sits
# outside every fs root; no network, no env. No [soe] section: it would close
# this sandbox's world (config/soe.rs).
[default_scopes.soe_view]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

[default_scopes.soe_propose]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

[default_scopes.soe_challenge]
fs_roots = ["/nonexistent/tengu-engine-matrix"]

# The xm set runs as a private agent (`xm_*`: no `description`, as exec tools
# require) through `tengu tool turn` — the `@<agent>` chat path, no run-agent
# workspace grant — so these scopes (and the xm agents' hl_ctx scope) cover
# the workspace themselves.
[default_scopes.risk_status]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]

[default_scopes.paper_positions]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]

[default_scopes.paper_order]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.paper_close]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.xm_exits]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[default_scopes.xm_weekend_fade]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]

[agents.claude]
engine = "claude_code"
model = "claude-haiku-4-5"
description = "Engine-matrix fixture: Claude CLI (subscription) claude-haiku-4-5, built-ins off."
tools = ["list_directory", "read_file", "write_file", "hl_ctx", "hl_book", "market_history", "backtest", "strategy_ranking", "source_evidence", "soe_view", "soe_propose", "soe_challenge"]
workspace = "${TENGU_MATRIX_WORKSPACE}"

[agents.claude.claude_code]
builtin_tools_profile = "none"

[agents.claude.limits]
max_tool_rounds = 10

# Private exec agent (no description): the xm set via `tengu tool turn`.
[agents.xm_claude]
engine = "claude_code"
model = "claude-haiku-4-5"
tools = ["hl_ctx", "paper_order", "paper_positions", "paper_close", "xm_exits", "risk_status", "xm_weekend_fade"]
workspace = "${TENGU_MATRIX_WORKSPACE}"

[agents.xm_claude.claude_code]
builtin_tools_profile = "none"

[agents.xm_claude.limits]
max_tool_rounds = 12

[agents.xm_claude.scopes.hl_ctx]
fs_roots = ["${TENGU_MATRIX_WORKSPACE}"]
net_hosts = ["api.hyperliquid.xyz"]
env_reads = ["HL_API_URL"]
