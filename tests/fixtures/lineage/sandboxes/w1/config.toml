interval = "5m"
calendar = "us_equity"
direction = "fade"
min_abs_signal_bps = 0
exclude = ["hyperliquid:xyz:KIOXIA"]
costs = { taker_fee_bps = 1.9, half_spread = { model = "fixed", bps = 0.0 }, slippage_bps = 0.0, funding = false }

# The rejected predecessor: overnight follow-through on the same names.
[backtest.strategies.overnight]
kind = "daily_window"
universe = ["hyperliquid:xyz:AAPL", "hyperliquid:xyz:TSLA", "hyperliquid:xyz:NVDA"]
interval = "1h"
days = "trading"
calendar = "us_equity"
tz = "America/New_York"
anchor = "16:00"
entry = "20:00"
exit = "09:00"
direction = "follow"
min_abs_signal_bps = 100

[risk]
account = "lineage-fixture-w1"
mode = "paper"
venues = ["hyperliquid"]
min_lifecycle = "paper_tradable"
instruments_allow = ["hyperliquid:xyz:AAPL", "hyperliquid:xyz:TSLA", "hyperliquid:xyz:NVDA"]
instruments_deny = []
max_order_notional_usd = 25
max_position_notional_usd = 50
max_asset_exposure_usd = 50
max_venue_exposure_usd = 110
max_gross_exposure_usd = 110
max_net_exposure_usd = 110
max_leverage = 1.2
daily_loss_limit_usd = 10
total_loss_limit_usd = 25
min_edge_bps = 10
max_slippage_bps = 30
min_depth_usd = 250
require_hedge_for = []
max_data_age_ms = { book = 5000, ctx = 90000, reference = 60000, quote = 20000 }
max_skew_ms = 5000
max_orders_per_min = 12
max_open_orders = 4
kill_switch_file = "~/.tengu/state/lineage-fixture-w1/KILL"
allow_reduce_degraded = true

[risk.exits]
take_profit_bps = 2000
stop_loss_bps = 1000
max_hold_secs = 259200

[paper]
initial_cash_usd = 100
latency_ms = 250
latency_jitter_ms = 100
fee_tier = 0
staking_discount_pct = 0
order_types = ["market", "ioc"]

[agents.architect]
default = true
engine = "openrouter"
model = "anthropic/claude-opus-4.7"
workspace = "~/lineage-fixture-ws"
tools = ["backtest", "market_history", "read_file"]
description = "The fixture's Architect: backtests rule W on history."

[default_scopes.sign_and_send_transaction]

[default_scopes.sign_message]

[default_scopes.write_file]

[default_scopes.run_command]

[default_scopes.http_request]

[default_scopes.read_file]
fs_roots = ["~/lineage-fixture-ws"]

[default_scopes.backtest]
fs_roots = ["~/lineage-fixture-ws"]

[default_scopes.market_history]
fs_roots = ["~/lineage-fixture-ws"]
net_hosts = ["api.hyperliquid.xyz"]
