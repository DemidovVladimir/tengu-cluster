# (tests/fixtures/soe/profile.synthetic.toml).
schema = "soe.cycle_case/1"
id = "digital_asset"
version = 1
synthetic = true
profile = "synthetic-operator"
note = "PRD § 12 #2: two listed tools to buy. Both get acquisition economics and a maximum staged loss (memo). The template shop's deal is verified, but the Critic's TRANSFERABILITY challenge blocks the legal gate (its payment account moves only with the seller's company): DILIGENCE — the transfer question and the next tranche only. The second listing names a red flag (escrow refused): REJECT, the NO-GO path; no price clears it."
week = "2026-W41"
decided_at = "2026-10-05T12:00:00Z"

[[records]]
src = "REPO"
native = "template-shop"
published = "2026-10-04T09:00:00Z"

[[records]]
src = "REPO"
native = "theme-bundle"
published = "2026-10-04T10:00:00Z"

[expected]
hold = true
allocation = { owner_hours = 0, cash = "0.00" }
ranked = []
held = [
  { id = "template-shop-acquisition", gates = ["LEGAL_UNRESOLVED"], action = { kind = "DILIGENCE", max_next_tranche = "900.00", questions = [
    "challenge.2026-W41.c01: Transferability challenge `2026-W41.c01`: the listing says the payment account belongs to the seller's company, so it moves only with the company",
  ] } },
]
rejected = [{ id = "theme-bundle-acquisition", action = "REJECT", gates = ["DEAL_RED_FLAG"] }]

