# Synthetic cycle case: invented example values and test sources
# (`domain::source::testkit`, example.org urls) — no real firm, person or
# figure. Expectations hold for the profile `synthetic-operator`
# (tests/fixtures/soe/profile.synthetic.toml).
schema = "soe.cycle_case/1"
id = "high_ticket_integration"
version = 1
synthetic = true
profile = "synthetic-operator"
note = "PRD § 12 #3: a one-off ERP integration priced with owner time (50 h at the shadow rate), a 65 % win probability, a bounded scope and collection loss — revenue quality ONE_OFF, no recurring revenue claimed. Two independent buyer posts are two demand events: it passes, ranks and gets the week's cheap test."
week = "2026-W41"
decided_at = "2026-10-05T12:00:00Z"

[[records]]
src = "FORUM"
native = "p-61"
published = "2026-09-30T12:00:00Z"

[[records]]
src = "FORUM"
native = "p-62"
published = "2026-10-02T12:00:00Z"

[expected]
hold = false
allocation = { owner_hours = 5, cash = "0.00" }
ranked = [{ id = "erp-integration", action = { kind = "CHEAP_TEST", max_cash = "0.00", max_hours = 5 } }]
held = []
rejected = []
confirmations = { p-61 = 1, p-62 = 1 }

[[proposals]]
novelty = "MEDIUM"

[proposals.opportunity]
schema = "soe.opportunity/1"
id = "erp-integration"
version = 1
as_of = "2026-10-04"
customer = "a mid-size logistics firm (synthetic example)"
pain = "two order systems that do not talk"
mechanism = "HIGH_TICKET_DELIVERY"
alternatives = ["INTEGRATE", "REJECT"]
requires_skills = ["integration"]
signals = ["@p-61", "@p-62"]

[proposals.opportunity.jurisdictions]
customer = "DE"
operator = "DE"
entity = "DE"
delivery = "EU"
tax = "DE"
payment = "EU"
data = "EU"

[proposals.opportunity.economics]
currency = "EUR"
revenue_quality = "ONE_OFF"
tax_review = "UNKNOWN"
variable_cost = { value = { low = 300, base = 500, high = 700 }, evidence = [], as_of = "2026-10-01" }
fixed_costs_per_month = { value = { low = "0.00", base = "20.00", high = "40.00" }, evidence = [], as_of = "2026-10-01" }
owner_hours_per_month = { value = { low = 0, base = 0, high = 0 }, evidence = [], as_of = "2026-10-01" }
ramp_months = { value = { low = 0, base = 1, high = 1 }, evidence = [], as_of = "2026-10-01" }

[proposals.opportunity.economics.revenue]
kind = "ONE_OFF"
contract_value = { value = { low = "13000.00", base = "16000.00", high = "18000.00" }, evidence = ["url:https://example.org/buyer_forum/p-61", "url:https://example.org/buyer_forum/p-62"], as_of = "2026-10-01" }
win_probability = { value = { low = 4500, base = 6500, high = 7500 }, evidence = [], as_of = "2026-10-01" }
delivery_weeks = { value = { low = 3, base = 4, high = 5 }, evidence = [], as_of = "2026-10-01" }
owner_hours_total = { value = { low = 40, base = 50, high = 70 }, evidence = [], as_of = "2026-10-01" }
collection_loss = { value = { low = 0, base = 200, high = 400 }, evidence = [], as_of = "2026-10-01" }

[proposals.opportunity.economics.initial]
acquisition = { value = { low = "0.00", base = "0.00", high = "0.00" }, evidence = [], as_of = "2026-10-01" }
setup = { value = { low = "300.00", base = "500.00", high = "800.00" }, evidence = [], as_of = "2026-10-01" }
validation = { value = { low = "0.00", base = "200.00", high = "300.00" }, evidence = [], as_of = "2026-10-01" }
working_capital = { value = { low = "0.00", base = "0.00", high = "0.00" }, evidence = [], as_of = "2026-10-01" }

[proposals.opportunity.risk]
risks = [{ kind = "PAYMENT", probability = { low = 300, base = 700, high = 1500 }, impact = { low = "0.00", base = "4000.00", high = "9000.00" }, control = "milestone invoices, half upfront", status = "UNRESOLVED" }]
concentration = [{ dimension = "CLIENT", name = "the one client", share = 10000 }]

[proposals.opportunity.risk.max_loss]
cash = { low = "500.00", base = "1200.00", high = "3500.00" }
owner_hours = { low = 30, base = 50, high = 90 }
reputation = "a failed go-live at one client"
dependency = "the client's ERP vendor"

[proposals.opportunity.risk.bounds]
owner_time = "BOUNDED"
support = "BOUNDED"
payment_access = "BOUNDED"
scope = "BOUNDED"

[proposals.opportunity.experiment]
hypothesis = "the client signs a fixed-scope integration"
metric = "signed statements of work"
threshold = { op = "GE", value = 3, unit = "paying clients" }
deadline = "2026-10-30"
expires_at = "2026-11-13"
max_owner_hours = 20
stop_rule = "fewer than 3 paying clients by the deadline"
approvals = ["CONTACT", "SPEND"]

[[proposals.opportunity.experiment.stages]]
name = "interviews"
cash = "0.00"
recoverable = "0.00"
owner_hours = 5

[[proposals.opportunity.experiment.stages]]
name = "pilot"
cash = "600.00"
recoverable = "0.00"
owner_hours = 15
stop_rule = "no paying client after 4 demos"

[proposals.opportunity.ordinal]
defensibility = "MEDIUM"
reversibility = "HIGH"

[[proposals.bases]]
field = "economics.revenue.contract_value"
basis = { kind = "FACT", evidence = ["@p-61", "@p-62"] }

[[proposals.bases]]
field = "economics.revenue.win_probability"
basis = { kind = "INFERENCE", why = "two buyers asked; one in three such requests usually signs" }

[[proposals.bases]]
field = "economics.revenue.owner_hours_total"
basis = { kind = "INFERENCE", why = "the hours of the last fixed-scope integration" }

[[proposals.forecast]]
observable = { kind = "OPERATOR_RESOLVES", question = "does either buyer accept a fixed-scope quote" }
probability = 4000
resolve_by = "2026-11-02"

[[proposals.forecast]]
observable = { kind = "ASSUMPTION_WITHIN", field = "economics.revenue.owner_hours_total", low = "40", high = "70" }
probability = 7000
resolve_by = "2026-12-14"
