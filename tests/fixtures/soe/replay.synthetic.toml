# Synthetic O4 replay set (`soe.replay_set/1`): invented labels and notes —
# no real week, firm or outcome. Expectations hold for the profile
# `synthetic-operator` (tests/fixtures/soe/profile.synthetic.toml). The
# operator's real set is private: <TENGU_HOME>/state/soe/eval/, never in a
# git work tree (`replay_set_in_repo`). Used by `domain::soe::replay` tests
# and tests/soe_cli.rs.
schema = "soe.replay_set/1"
id = "synthetic-replay"
version = 1
synthetic = true
profile = "synthetic-operator"
note = "two development weeks, one holdout week"

[[cases]]
id = "dev-hold"
decided_at = "2026-10-05T12:00:00Z"
split = "DEVELOPMENT"
label = "HOLD"
outcome_note = "nothing came of it"

[[cases]]
id = "dev-good"
decided_at = "2026-10-05T12:00:00Z"
split = "DEVELOPMENT"
label = "GOOD"
good = ["a"]
bad = ["b"]
outcome_note = "a paid"

[[cases]]
id = "late-holdout"
decided_at = "2026-09-07T12:00:00Z"
week = "2026-W36"
split = "HOLDOUT"
label = "BAD"
outcome_note = "the buyer never paid"
