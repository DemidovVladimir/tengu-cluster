# kg-calendars fixture = the [xmarket.calendars.*] rows of config.example.toml
# (keep the two in sync). NYSE dates verified on
# https://www.nyse.com/markets/hours-calendars 2026-09-30.

[xmarket]
state = "xmarket"

# NYSE sessions (ET): overnight 20:00-04:00 before a trading day, pre
# 04:00-09:30, core 09:30-16:00, post 16:00-20:00; early closes 13:00 with
# late trading until 17:00.
[xmarket.calendars.us_equity]
kind = "exchange"
tz = "America/New_York"
core = ["09:30", "16:00"]
pre = "04:00"
post = "20:00"
overnight = true
early_close = "13:00"
early_post = "17:00"
holidays = [
  "2026-01-01", "2026-01-19", "2026-02-16", "2026-04-03", "2026-05-25",
  "2026-06-19", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25",
  "2027-01-01", "2027-01-18", "2027-02-15", "2027-03-26", "2027-05-31",
  "2027-06-18", "2027-07-05", "2027-09-06", "2027-11-25", "2027-12-24",
  "2028-01-17", "2028-02-21", "2028-04-14", "2028-05-29", "2028-06-19",
  "2028-07-04", "2028-09-04", "2028-11-23", "2028-12-25",
]
early_closes = ["2026-11-27", "2026-12-24", "2027-11-26", "2028-07-03", "2028-11-24"]

# trade[XYZ] external price: US stocks (= the 24x5 equity feeds).
[xmarket.calendars.xyz_stocks]
kind = "weekly"
tz = "America/New_York"
open = "Sun 20:00"
close = "Fri 20:00"

# trade[XYZ] US indices and commodities, closed daily 17:00-18:00.
[xmarket.calendars.xyz_indices]
kind = "weekly"
tz = "America/New_York"
open = "Sun 18:00"
close = "Fri 17:00"
daily_break = ["17:00", "18:00"]

# trade[XYZ] FX.
[xmarket.calendars.xyz_fx]
kind = "weekly"
tz = "America/New_York"
open = "Sun 17:00"
close = "Fri 17:00"

# Robinhood stock-token mint / redeem window.
[xmarket.calendars.rh_tokenization]
kind = "weekly"
tz = "Europe/Paris"
open = "Mon 02:00"
close = "Sat 02:00"

# Hyperliquid crypto perps.
[xmarket.calendars.crypto]
kind = "24x7"
